<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MESTER PAX</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(
            circle at top,
            #292929 0%,
            #111 45%,
            #070707 100%
        );
    color: #fff;
    font-family: Tahoma, Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 20px 15px 50px;
}

.logo {
    text-align: center;
    padding: 28px 0 25px;
}

.logo h1 {
    margin: 0;
    font-size: 38px;
    letter-spacing: 4px;
}

.logo p {
    margin: 10px 0 0;
    color: #888;
    font-size: 13px;
}

.card {
    background: #171717;
    border: 1px solid #2b2b2b;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
}

.title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 17px;
}

.services {
    display: grid;
    gap: 10px;
}

.service {
    width: 100%;
    border: 1px solid #333;
    background: #222;
    color: #fff;
    border-radius: 12px;
    min-height: 52px;
    font-family: inherit;
    text-align: right;
    padding: 0 16px;
    cursor: pointer;
    font-size: 14px;
}

.service.selected {
    background: #fff;
    color: #000;
    border-color: #fff;
    font-weight: bold;
}

.calendar {
    background: #111;
    border: 1px solid #292929;
    border-radius: 17px;
    overflow: hidden;
}

.calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px;
    border-bottom: 1px solid #292929;
}

.calendar-title {
    text-align: center;
    font-size: 15px;
    font-weight: bold;
}

.calendar-nav {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: #242424;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 10px 7px 5px;
    color: #777;
    font-size: 11px;
    text-align: center;
}

.days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    padding: 5px 7px 12px;
}

.day {
    aspect-ratio: 1 / 1;
    min-width: 0;
    border: none;
    border-radius: 10px;
    background: #1d1d1d;
    color: #eee;
    font-family: inherit;
    cursor: pointer;
    font-size: 13px;
}

.day:hover {
    background: #333;
}

.day.empty {
    background: transparent;
    cursor: default;
}

.day.today {
    border: 1px solid #777;
}

.day.selected {
    background: #fff;
    color: #000;
    font-weight: bold;
}

.day.disabled {
    color: #444;
    background: #151515;
    cursor: not-allowed;
}

.selected-date {
    text-align: center;
    padding: 12px 10px 0;
    color: #bbb;
    font-size: 13px;
}

.times {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 16px;
}

.time {
    min-height: 50px;
    border: 1px solid #333;
    background: #222;
    color: #fff;
    border-radius: 12px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
}

.time.selected {
    background: #fff;
    color: #000;
    border-color: #fff;
    font-weight: bold;
}

.time.reserved {
    background: #351b1b;
    color: #777;
    border-color: #4b2828;
    cursor: not-allowed;
    text-decoration: line-through;
}

.loading,
.no-times {
    grid-column: 1 / -1;
    text-align: center;
    color: #777;
    padding: 20px 5px;
    font-size: 13px;
    line-height: 2;
}

.label {
    display: block;
    color: #888;
    font-size: 12px;
    margin: 0 0 7px;
}

input {
    width: 100%;
    height: 50px;
    margin-bottom: 15px;
    padding: 0 14px;
    border: 1px solid #333;
    border-radius: 12px;
    background: #222;
    color: #fff;
    outline: none;
    font-family: inherit;
    font-size: 14px;
}

input:focus {
    border-color: #777;
}

.submit {
    width: 100%;
    height: 54px;
    margin-top: 3px;
    border: none;
    border-radius: 13px;
    background: #fff;
    color: #000;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.submit:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.message {
    display: none;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 15px;
    text-align: center;
    font-size: 13px;
    line-height: 1.8;
}

.message.success {
    display: block;
    background: #12351e;
    color: #8eeaa2;
}

.message.error {
    display: block;
    background: #401b1b;
    color: #ff9b9b;
}

footer {
    text-align: center;
    color: #555;
    font-size: 11px;
    line-height: 2;
    margin-top: 20px;
}

@media(max-width:380px) {

    .logo h1 {
        font-size: 30px;
    }

    .day {
        font-size: 11px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

    <h1>MESTER PAX</h1>

    <p>
        مدیریت یوسف قربانی
    </p>

</div>

<div id="message" class="message"></div>


<!-- خدمات -->

<div class="card">

    <div class="title">
        انتخاب خدمت
    </div>

    <div class="services">

        <button
            type="button"
            class="service"
            data-service="کوتاهی مو"
        >
            کوتاهی مو
        </button>

        <button
            type="button"
            class="service"
            data-service="اصلاح ریش"
        >
            اصلاح ریش
        </button>

        <button
            type="button"
            class="service"
            data-service="کوتاهی + اصلاح ریش"
        >
            کوتاهی + اصلاح ریش
        </button>

    </div>

</div>


<!-- تقویم -->

<div class="card">

    <div class="title">
        انتخاب تاریخ و ساعت
    </div>

    <div class="calendar">

        <div class="calendar-header">

            <button
                type="button"
                class="calendar-nav"
                id="nextMonth"
            >
                ‹
            </button>

            <div
                class="calendar-title"
                id="calendarTitle"
            ></div>

            <button
                type="button"
                class="calendar-nav"
                id="prevMonth"
            >
                ›
            </button>

        </div>

        <div class="weekdays">

            <div>شنبه</div>
            <div>یکشنبه</div>
            <div>دوشنبه</div>
            <div>سه‌شنبه</div>
            <div>چهارشنبه</div>
            <div>پنجشنبه</div>
            <div>جمعه</div>

        </div>

        <div
            class="days"
            id="days"
        ></div>

    </div>

    <div
        class="selected-date"
        id="selectedDateText"
    >
        تاریخ انتخاب نشده
    </div>

    <div
        class="times"
        id="times"
    >

        <div class="no-times">
            ابتدا یک تاریخ را انتخاب کنید
        </div>

    </div>

</div>


<!-- اطلاعات مشتری -->

<div class="card">

    <div class="title">
        اطلاعات مشتری
    </div>

    <label class="label">
        نام مشتری
    </label>

    <input
        id="customerName"
        type="text"
        placeholder="مثلاً علی رضایی"
    >

    <label class="label">
        شماره موبایل
    </label>

    <input
        id="phone"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        placeholder="09123456789"
    >

    <button
        type="button"
        id="submitButton"
        class="submit"
        disabled
    >
        ثبت نوبت
    </button>

</div>


<footer>

    MESTER PAX

    <br>

    مدیریت یوسف قربانی

</footer>

</div>


<script>

/* ========================================
   آدرس Google Apps Script
======================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzn111x1wlJU2ey4WT-q8I7OIZvMyhyK_MlbZST98TCWJ4wix5w8hq4khaDiJPL_I39/exec";


/* ========================================
   اطلاعات تقویم
======================================== */

const monthNames = [
    "فروردین",
    "اردیبهشت",
    "خرداد",
    "تیر",
    "مرداد",
    "شهریور",
    "مهر",
    "آبان",
    "آذر",
    "دی",
    "بهمن",
    "اسفند"
];

const weekdayNames = [
    "شنبه",
    "یکشنبه",
    "دوشنبه",
    "سه‌شنبه",
    "چهارشنبه",
    "پنجشنبه",
    "جمعه"
];

const persianDigits = "۰۱۲۳۴۵۶۷۸۹";


/* ========================================
   متغیرها
======================================== */

let selectedService = "";
let selectedTime = "";
let selectedGregorianDate = "";

let calendarYear = 0;
let calendarMonth = 0;

let selectedPersianDay = 0;
let selectedCalendarYear = 0;
let selectedCalendarMonth = 0;

let loadingTimes = false;


/* ========================================
   اعداد فارسی
======================================== */

function toPersianDigits(value) {

    return String(value).replace(
        /\d/g,
        d => persianDigits[d]
    );

}


/* ========================================
   تبدیل میلادی به شمسی
======================================== */

function gregorianToJalali(
    gy,
    gm,
    gd
) {

    const date =
        new Date(
            gy,
            gm - 1,
            gd
        );


    const formatter =
        new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year: "numeric",
                month: "numeric",
                day: "numeric"
            }
        );


    const parts =
        formatter.formatToParts(date);


    let year = 0;
    let month = 0;
    let day = 0;


    parts.forEach(part => {

        const value =
            part.value.replace(
                /[۰-۹]/g,
                d =>
                    String(
                        persianDigits.indexOf(d)
                    )
            );


        if (part.type === "year") {
            year = Number(value);
        }

        if (part.type === "month") {
            month = Number(value);
        }

        if (part.type === "day") {
            day = Number(value);
        }

    });


    return {
        year,
        month,
        day
    };

}


/* ========================================
   تبدیل شمسی به میلادی
======================================== */

function jalaliToGregorian(
    jy,
    jm,
    jd
) {

    /*
      محدوده تقریبی سال میلادی
    */

    const approximateYear =
        jy + 621;


    const start =
        new Date(
            approximateYear - 2,
            0,
            1
        );


    const end =
        new Date(
            approximateYear + 2,
            11,
            31
        );


    for (
        let d = new Date(start);
        d <= end;
        d.setDate(
            d.getDate() + 1
        )
    ) {

        const p =
            gregorianToJalali(
                d.getFullYear(),
                d.getMonth() + 1,
                d.getDate()
            );


        if (
            p.year === jy &&
            p.month === jm &&
            p.day === jd
        ) {

            return {
                year: d.getFullYear(),
                month: d.getMonth() + 1,
                day: d.getDate()
            };

        }

    }


    return null;

}


/* ========================================
   امروز
======================================== */

function getTodayJalali() {

    const now = new Date();

    return gregorianToJalali(
        now.getFullYear(),
        now.getMonth() + 1,
        now.getDate()
    );

}


/* ========================================
   تعداد روزهای ماه
======================================== */

function getDaysInJalaliMonth(
    year,
    month
) {

    let count = 0;


    for (
        let day = 1;
        day <= 31;
        day++
    ) {

        const g =
            jalaliToGregorian(
                year,
                month,
                day
            );


        if (!g) {
            break;
        }


        count++;

    }


    return count;

}


/* ========================================
   روز هفته
   شنبه = 0
======================================== */

function getWeekIndex(
    gy,
    gm,
    gd
) {

    const date =
        new Date(
            gy,
            gm - 1,
            gd
        );


    return (
        date.getDay() + 1
    ) % 7;

}


/* ========================================
   شمسی → ISO
======================================== */

function jalaliToISO(
    year,
    month,
    day
) {

    const g =
        jalaliToGregorian(
            year,
            month,
            day
        );


    if (!g) {
        return "";
    }


    return (
        g.year +
        "-" +
        String(g.month).padStart(2, "0") +
        "-" +
        String(g.day).padStart(2, "0")
    );

}


/* ========================================
   مقایسه تاریخ
======================================== */

function compareJalali(
    y1,
    m1,
    d1,
    y2,
    m2,
    d2
) {

    if (y1 !== y2) {
        return y1 - y2;
    }

    if (m1 !== m2) {
        return m1 - m2;
    }

    return d1 - d2;

}


/* ========================================
   رسم تقویم
======================================== */

function renderCalendar() {

    const title =
        document.getElementById(
            "calendarTitle"
        );


    const days =
        document.getElementById(
            "days"
        );


    title.textContent =
        monthNames[
            calendarMonth - 1
        ] +
        " " +
        toPersianDigits(
            calendarYear
        );


    days.innerHTML = "";


    const first =
        jalaliToGregorian(
            calendarYear,
            calendarMonth,
            1
        );


    if (!first) {
        return;
    }


    const firstWeekday =
        getWeekIndex(
            first.year,
            first.month,
            first.day
        );


    const totalDays =
        getDaysInJalaliMonth(
            calendarYear,
            calendarMonth
        );


    const today =
        getTodayJalali();


    for (
        let i = 0;
        i < firstWeekday;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "day empty";


        days.appendChild(empty);

    }


    for (
        let day = 1;
        day <= totalDays;
        day++
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.type = "button";

        button.className = "day";


        button.textContent =
            toPersianDigits(day);


        if (
            calendarYear === today.year &&
            calendarMonth === today.month &&
            day === today.day
        ) {

            button.classList.add(
                "today"
            );

        }


        if (
            calendarYear ===
                selectedCalendarYear &&
            calendarMonth ===
                selectedCalendarMonth &&
            day === selectedPersianDay
        ) {

            button.classList.add(
                "selected"
            );

        }


        const past =
            compareJalali(
                calendarYear,
                calendarMonth,
                day,
                today.year,
                today.month,
                today.day
            ) < 0;


        if (past) {

            button.classList.add(
                "disabled"
            );

            button.disabled = true;

        }
        else {

            button.addEventListener(
                "click",
                () => {

                    selectDate(
                        calendarYear,
                        calendarMonth,
                        day
                    );

                }
            );

        }


        days.appendChild(button);

    }

}


/* ========================================
   انتخاب تاریخ
======================================== */

function selectDate(
    year,
    month,
    day
) {

    selectedCalendarYear = year;

    selectedCalendarMonth = month;

    selectedPersianDay = day;


    selectedGregorianDate =
        jalaliToISO(
            year,
            month,
            day
        );


    selectedTime = "";


    const g =
        jalaliToGregorian(
            year,
            month,
            day
        );


    const weekday =
        getWeekIndex(
            g.year,
            g.month,
            g.day
        );


    document.getElementById(
        "selectedDateText"
    ).textContent =
        weekdayNames[weekday] +
        " " +
        toPersianDigits(day) +
        " " +
        monthNames[month - 1] +
        " " +
        toPersianDigits(year);


    renderCalendar();

    loadTimes();

    checkForm();

}


/* ========================================
   ماه بعد
======================================== */

document
.getElementById("nextMonth")
.addEventListener(
    "click",
    function() {

        calendarMonth++;


        if (calendarMonth > 12) {

            calendarMonth = 1;

            calendarYear++;

        }


        renderCalendar();

    }
);


/* ========================================
   ماه قبل
======================================== */

document
.getElementById("prevMonth")
.addEventListener(
    "click",
    function() {

        const today =
            getTodayJalali();


        if (
            calendarYear === today.year &&
            calendarMonth === today.month
        ) {

            return;

        }


        calendarMonth--;


        if (calendarMonth < 1) {

            calendarMonth = 12;

            calendarYear--;

        }


        renderCalendar();

    }
);


/* ========================================
   خدمات
======================================== */

document
.querySelectorAll(".service")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            document
            .querySelectorAll(".service")
            .forEach(item => {

                item.classList.remove(
                    "selected"
                );

            });


            button.classList.add(
                "selected"
            );


            selectedService =
                button.dataset.service;


            checkForm();

        }
    );

});


/* ========================================
   دریافت ساعت‌ها
======================================== */

async function loadTimes() {

    if (!selectedGregorianDate) {
        return;
    }


    loadingTimes = true;

    selectedTime = "";


    checkForm();


    const times =
        document.getElementById(
            "times"
        );


    times.innerHTML = `
        <div class="loading">
            در حال بررسی نوبت‌های آزاد...
        </div>
    `;


    try {

        const url =
            GOOGLE_SCRIPT_URL +
            "?action=times" +
            "&date=" +
            encodeURIComponent(
                selectedGregorianDate
            ) +
            "&_=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message ||
                "خطا"
            );

        }


        renderTimes(
            data.allTimes || [],
            data.reservedTimes || []
        );

    }
    catch(error) {

        console.error(error);


        times.innerHTML = `
            <div class="no-times">
                دریافت نوبت‌ها انجام نشد.
                <br>
                دوباره تلاش کنید.
            </div>
        `;

    }


    loadingTimes = false;

    checkForm();

}


/* ========================================
   نمایش ساعت‌ها
======================================== */

function renderTimes(
    allTimes,
    reservedTimes
) {

    const times =
        document.getElementById(
            "times"
        );


    times.innerHTML = "";


    if (!allTimes.length) {

        times.innerHTML = `
            <div class="no-times">
                ساعتی برای این روز تعریف نشده است.
            </div>
        `;

        return;

    }


    const reserved =
        reservedTimes.map(
            time =>
                String(time).trim()
        );


    allTimes.forEach(time => {

        const button =
            document.createElement(
                "button"
            );


        button.type = "button";

        button.className = "time";

        button.textContent = time;


        if (
            reserved.includes(
                String(time).trim()
            )
        ) {

            button.classList.add(
                "reserved"
            );


            button.disabled = true;


            button.title =
                "این ساعت قبلاً رزرو شده است.";

        }
        else {

            button.addEventListener(
                "click",
                function() {

                    document
                    .querySelectorAll(".time")
                    .forEach(item => {

                        item.classList.remove(
                            "selected"
                        );

                    });


                    button.classList.add(
                        "selected"
                    );


                    selectedTime = time;


                    checkForm();

                }
            );

        }


        times.appendChild(button);

    });

}


/* ========================================
   فرم
======================================== */

const nameInput =
document.getElementById(
    "customerName"
);

const phoneInput =
document.getElementById(
    "phone"
);

const submitButton =
document.getElementById(
    "submitButton"
);

const message =
document.getElementById(
    "message"
);


nameInput.addEventListener(
    "input",
    checkForm
);


phoneInput.addEventListener(
    "input",
    function() {

        phoneInput.value =
            phoneInput.value.replace(
                /\D/g,
                ""
            );


        checkForm();

    }
);


/* ========================================
   بررسی فرم
======================================== */

function checkForm() {

    const name =
        nameInput.value.trim();


    const phone =
        phoneInput.value.trim();


    const validPhone =
        /^09\d{9}$/.test(
            phone
        );


    submitButton.disabled =
        !(
            selectedService &&
            selectedGregorianDate &&
            selectedTime &&
            name &&
            validPhone &&
            !loadingTimes
        );

}


/* ========================================
   پیام
======================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;


    message.className =
        "message " +
        type;

}


/* ========================================
   ثبت نوبت
======================================== */

submitButton.addEventListener(
    "click",
    bookAppointment
);


async function bookAppointment() {

    if (submitButton.disabled) {
        return;
    }


    submitButton.disabled = true;

    submitButton.textContent =
        "در حال ثبت...";


    try {

        const params =
            new URLSearchParams();


        params.append(
            "action",
            "book"
        );


        params.append(
            "customerName",
            nameInput.value.trim()
        );


        params.append(
            "phone",
            phoneInput.value.trim()
        );


        params.append(
            "service",
            selectedService
        );


        params.append(
            "date",
            selectedGregorianDate
        );


        params.append(
            "time",
            selectedTime
        );


        const response =
            await fetch(
                GOOGLE_SCRIPT_URL +
                "?" +
                params.toString() +
                "&_=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            showMessage(
                data.message ||
                "این ساعت قبلاً رزرو شده است.",
                "error"
            );


            await loadTimes();


            return;

        }


        showMessage(
            "نوبت شما با موفقیت ثبت شد.",
            "success"
        );


        nameInput.value = "";

        phoneInput.value = "";

        selectedTime = "";


        await loadTimes();

    }
    catch(error) {

        console.error(error);


        showMessage(
            "ارتباط با سرور برقرار نشد.",
            "error"
        );

    }


    submitButton.textContent =
        "ثبت نوبت";


    checkForm();

}

    const today =
        getTodayJalali();


    calendarYear =
        today.year;


    calendarMonth =
        today.month;


    renderCalendar();

})();

</script>
