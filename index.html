<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MESTER PAX</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at top,
      #292929 0%,
      #111 45%,
      #070707 100%
    );

  color: #fff;

  font-family:
    Tahoma,
    Arial,
    sans-serif;
}

.container {

  width: 100%;

  max-width: 520px;

  margin: auto;

  padding:
    20px 15px 50px;
}

.logo {

  text-align: center;

  padding:
    28px 0 25px;
}

.logo h1 {

  margin: 0;

  font-size: 38px;

  letter-spacing: 4px;
}

.logo p {

  margin:
    10px 0 0;

  color: #888;

  font-size: 13px;
}

.card {

  background: #171717;

  border:
    1px solid #2b2b2b;

  border-radius: 20px;

  padding: 20px;

  margin-bottom: 16px;
}

.title {

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 17px;
}

.services {

  display: grid;

  gap: 10px;
}

.service {

  width: 100%;

  border:
    1px solid #333;

  background: #222;

  color: #fff;

  border-radius: 12px;

  min-height: 52px;

  font-family: inherit;

  text-align: right;

  padding: 0 16px;

  cursor: pointer;

  font-size: 14px;
}

.service.selected {

  background: #fff;

  color: #000;

  border-color: #fff;

  font-weight: bold;
}

.calendar {

  background: #111;

  border:
    1px solid #292929;

  border-radius: 17px;

  overflow: hidden;
}

.calendar-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 14px;

  border-bottom:
    1px solid #292929;
}

.calendar-title {

  text-align: center;

  font-size: 15px;

  font-weight: bold;
}

.calendar-nav {

  width: 38px;

  height: 38px;

  border: none;

  border-radius: 10px;

  background: #242424;

  color: white;

  font-size: 20px;

  cursor: pointer;
}

.weekdays {

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  padding:
    10px 7px 5px;

  color: #777;

  font-size: 11px;

  text-align: center;
}

.days {

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  gap: 5px;

  padding:
    5px 7px 12px;
}

.day {

  aspect-ratio: 1 / 1;

  min-width: 0;

  border: none;

  border-radius: 10px;

  background: #1d1d1d;

  color: #eee;

  font-family: inherit;

  cursor: pointer;

  font-size: 13px;
}

.day:hover {

  background: #333;
}

.day.empty {

  background: transparent;

  cursor: default;
}

.day.today {

  border:
    1px solid #777;
}

.day.selected {

  background: #fff;

  color: #000;

  font-weight: bold;
}

.day.disabled {

  color: #444;

  background: #151515;

  cursor: not-allowed;
}

.day.friday {

  color: #555;

  background: #151515;

  cursor: not-allowed;

  text-decoration: line-through;
}

.selected-date {

  text-align: center;

  padding:
    12px 10px 0;

  color: #bbb;

  font-size: 13px;
}

.times {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 10px;

  margin-top: 16px;
}

.time {

  min-height: 50px;

  border:
    1px solid #333;

  background: #222;

  color: #fff;

  border-radius: 12px;

  font-family: inherit;

  font-size: 15px;

  cursor: pointer;
}

.time.selected {

  background: #fff;

  color: #000;

  border-color: #fff;

  font-weight: bold;
}

.time.reserved {

  background: #351b1b;

  color: #777;

  border-color: #4b2828;

  cursor: not-allowed;

  text-decoration: line-through;
}

.loading {

  grid-column:
    1 / -1;

  text-align: center;

  color: #777;

  padding: 20px 5px;

  font-size: 13px;
}

.no-times {

  grid-column:
    1 / -1;

  text-align: center;

  color: #777;

  padding: 20px 5px;

  font-size: 13px;

  line-height: 2;
}

.pending-box {

  background: #302b15;

  color: #e7d681;

  border:
    1px solid #514a24;

  border-radius: 14px;

  padding: 15px;

  margin-bottom: 15px;

  text-align: center;

  line-height: 2;
}

.approved-box {

  background: #12351e;

  color: #8eeaa2;

  border:
    1px solid #235d33;

  border-radius: 14px;

  padding: 15px;

  margin-bottom: 15px;

  text-align: center;

  line-height: 2;
}

.cancelled-box {

  background: #401b1b;

  color: #ff9b9b;

  border:
    1px solid #612727;

  border-radius: 14px;

  padding: 15px;

  margin-bottom: 15px;

  text-align: center;

  line-height: 2;
}

.label {

  display: block;

  color: #888;

  font-size: 12px;

  margin:
    0 0 7px;
}

input {

  width: 100%;

  height: 50px;

  margin-bottom: 15px;

  padding:
    0 14px;

  border:
    1px solid #333;

  border-radius: 12px;

  background: #222;

  color: #fff;

  outline: none;

  font-family: inherit;

  font-size: 14px;
}

input:focus {

  border-color: #777;
}

.submit {

  width: 100%;

  height: 54px;

  margin-top: 3px;

  border: none;

  border-radius: 13px;

  background: #fff;

  color: #000;

  font-family: inherit;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}

.submit:disabled {

  opacity: .35;

  cursor: not-allowed;
}

.message {

  display: none;

  padding: 14px;

  border-radius: 12px;

  margin-bottom: 15px;

  text-align: center;

  font-size: 13px;

  line-height: 1.8;
}

.message.success {

  display: block;

  background: #12351e;

  color: #8eeaa2;
}

.message.error {

  display: block;

  background: #401b1b;

  color: #ff9b9b;
}

footer {

  text-align: center;

  color: #555;

  font-size: 11px;

  line-height: 2;

  margin-top: 20px;
}

@media(max-width:380px) {

  .logo h1 {
    font-size: 30px;
  }

  .day {
    font-size: 11px;
  }

}

</style>

</head>

<script>


/*
=========================================
آدرس Google Apps Script
=========================================
*/

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzn111x1wlJU2ey4WT-q8I7OIZvMyhyK_MlbZST98TCWJ4wix5w8hq4khaDiJPL_I39/exec";


/*
=========================================
نام ماه‌ها
=========================================
*/

const monthNames = [

  "فروردین",
  "اردیبهشت",
  "خرداد",
  "تیر",
  "مرداد",
  "شهریور",
  "مهر",
  "آبان",
  "آذر",
  "دی",
  "بهمن",
  "اسفند"

];


/*
=========================================
روزها
=========================================
*/

const weekdayNames = [

  "شنبه",
  "یکشنبه",
  "دوشنبه",
  "سه‌شنبه",
  "چهارشنبه",
  "پنجشنبه",
  "جمعه"

];


/*
=========================================
اعداد فارسی
=========================================
*/

const persianDigits =
"۰۱۲۳۴۵۶۷۸۹";


function toPersianDigits(value) {

  return String(value).replace(
    /\d/g,
    function(d) {
      return persianDigits[
        Number(d)
      ];
    }
  );

}


/*
=========================================
متغیرها
=========================================
*/

let selectedService = "";

let selectedTime = "";

let selectedGregorianDate = "";

let selectedCalendarYear = 0;

let selectedCalendarMonth = 0;

let selectedPersianDay = 0;

let calendarYear = 0;

let calendarMonth = 0;

let loadingTimes = false;

let statusToken = "";

let statusTimer = null;


/*
=========================================
میلادی به شمسی
=========================================
*/

function gregorianToJalali(
  gy,
  gm,
  gd
) {

  const gDays = [

    31, 28, 31, 30, 31, 30,
    31, 31, 30, 31, 30, 31

  ];


  const jDays = [

    31, 31, 31, 31, 31, 31,
    30, 30, 30, 30, 30, 29

  ];


  let gy2 =
    gy - 1600;


  let gm2 =
    gm - 1;


  let gd2 =
    gd - 1;


  let gDayNo =
    365 * gy2;


  gDayNo +=
    Math.floor(
      (gy2 + 3) / 4
    );


  gDayNo -=
    Math.floor(
      (gy2 + 99) / 100
    );


  gDayNo +=
    Math.floor(
      (gy2 + 399) / 400
    );


  for (
    let i = 0;
    i < gm2;
    i++
  ) {

    gDayNo +=
      gDays[i];

  }


  if (
    gm2 > 1 &&
    (
      gy % 4 === 0 &&
      (
        gy % 100 !== 0 ||
        gy % 400 === 0
      )
    )
  ) {

    gDayNo++;

  }


  gDayNo +=
    gd2;


  let jDayNo =
    gDayNo - 79;


  const jNp =
    Math.floor(
      jDayNo / 12053
    );


  jDayNo %=
    12053;


  let jy =
    979 +
    33 * jNp +
    4 *
    Math.floor(
      jDayNo / 1461
    );


  jDayNo %=
    1461;


  if (
    jDayNo >= 366
  ) {

    jy +=
      Math.floor(
        (jDayNo - 1) / 365
      );

    jDayNo =
      (jDayNo - 1) % 365;

  }


  let jm = 0;


  while (
    jm < 11 &&
    jDayNo >= jDays[jm]
  ) {

    jDayNo -=
      jDays[jm];

    jm++;

  }


  return {

    year:
      jy,

    month:
      jm + 1,

    day:
      jDayNo + 1

  };

}


/*
=========================================
شمسی به میلادی
=========================================
*/

function jalaliToGregorian(
  jy,
  jm,
  jd
) {

  let jy2 =
    jy - 979;


  let days =
    365 * jy2;


  days +=
    Math.floor(
      jy2 / 33
    ) * 8;


  days +=
    Math.floor(
      (
        jy2 % 33 + 3
      ) / 4
    );


  if (jm <= 6) {

    days +=
      (jm - 1) * 31;

  }
  else {

    days +=
      (jm - 1) * 30 + 6;

  }


  days +=
    jd - 1;


  let gy =
    1600 +
    400 *
    Math.floor(
      days / 146097
    );


  days %=
    146097;


  if (
    days >= 36525
  ) {

    days--;

    gy +=
      100 *
      Math.floor(
        days / 36524
      );

    days %=
      36524;


    if (
      days >= 365
    ) {

      days++;

    }

  }


  gy +=
    4 *
    Math.floor(
      days / 1461
    );


  days %=
    1461;


  if (
    days >= 366
  ) {

    gy +=
      Math.floor(
        (days - 1) / 365
      );

    days =
      (days - 1) % 365;

  }


  let gd =
    days + 1;


  const leap =
    (
      gy % 4 === 0 &&
      (
        gy % 100 !== 0 ||
        gy % 400 === 0
      )
    );


  const monthDays = [

    31,
    leap ? 29 : 28,
    31, 30, 31, 30,
    31, 31, 30, 31,
    30, 31

  ];


  let gm = 1;


  for (
    let i = 0;
    i < 12;
    i++
  ) {

    if (
      gd > monthDays[i]
    ) {

      gd -=
        monthDays[i];

      gm++;

    }
    else {

      break;

    }

  }


  return {

    year:
      gy,

    month:
      gm,

    day:
      gd

  };

}


/*
=========================================
تاریخ امروز
=========================================
*/

function getTodayJalali() {

  const now =
    new Date();


  return gregorianToJalali(

    now.getFullYear(),

    now.getMonth() + 1,

    now.getDate()

  );

}


/*
=========================================
تعداد روزهای ماه
=========================================
*/

function getDaysInJalaliMonth(
  year,
  month
) {

  if (
    month <= 6
  ) {

    return 31;

  }


  if (
    month <= 11
  ) {

    return 30;

  }


  const g1 =
    jalaliToGregorian(
      year,
      1,
      1
    );


  const g2 =
    jalaliToGregorian(
      year + 1,
      1,
      1
    );


  const d1 =
    new Date(
      g1.year,
      g1.month - 1,
      g1.day
    );


  const d2 =
    new Date(
      g2.year,
      g2.month - 1,
      g2.day
    );


  return Math.round(
    (
      d2 - d1
    ) /
    86400000
  ) - 336;

}


/*
=========================================
روز هفته

شنبه = 0
=========================================
*/

function getWeekIndex(
  gy,
  gm,
  gd
) {

  const date =
    new Date(
      gy,
      gm - 1,
      gd
    );


  return (
    date.getDay() + 1
  ) % 7;

}


/*
=========================================
تاریخ به ISO
=========================================
*/

function jalaliToISO(
  year,
  month,
  day
) {

  const g =
    jalaliToGregorian(
      year,
      month,
      day
    );


  return (

    g.year +
    "-" +
    String(g.month)
      .padStart(2, "0") +
    "-" +
    String(g.day)
      .padStart(2, "0")

  );

}


/*
=========================================
مقایسه تاریخ
=========================================
*/

function compareJalali(
  y1,
  m1,
  d1,
  y2,
  m2,
  d2
) {

  if (
    y1 !== y2
  ) {

    return y1 - y2;

  }


  if (
    m1 !== m2
  ) {

    return m1 - m2;

  }


  return d1 - d2;

}


/*
=========================================
جمعه؟
=========================================
*/

function isFridayJalali(
  year,
  month,
  day
) {

  const g =
    jalaliToGregorian(
      year,
      month,
      day
    );


  return (
    new Date(
      g.year,
      g.month - 1,
      g.day
    ).getDay() === 5
  );

}


/*
=========================================
رسم تقویم
=========================================
*/

function renderCalendar() {

  const title =
    document.getElementById(
      "calendarTitle"
    );


  const days =
    document.getElementById(
      "days"
    );


  title.textContent =

    monthNames[
      calendarMonth - 1
    ]

    +
    " "

    +
    toPersianDigits(
      calendarYear
    );


  days.innerHTML = "";


  const first =
    jalaliToGregorian(
      calendarYear,
      calendarMonth,
      1
    );


  const firstWeekday =
    getWeekIndex(
      first.year,
      first.month,
      first.day
    );


  const totalDays =
    getDaysInJalaliMonth(
      calendarYear,
      calendarMonth
    );


  const today =
    getTodayJalali();


  for (
    let i = 0;
    i < firstWeekday;
    i++
  ) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "day empty";

    days.appendChild(
      empty
    );

  }


  for (
    let day = 1;
    day <= totalDays;
    day++
  ) {

    const button =
      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "day";


    button.textContent =
      toPersianDigits(
        day
      );


    const friday =
      isFridayJalali(
        calendarYear,
        calendarMonth,
        day
      );


    if (
      calendarYear === today.year &&
      calendarMonth === today.month &&
      day === today.day
    ) {

      button.classList.add(
        "today"
      );

    }


    if (
      calendarYear ===
        selectedCalendarYear &&
      calendarMonth ===
        selectedCalendarMonth &&
      day ===
        selectedPersianDay
    ) {

      button.classList.add(
        "selected"
      );

    }


    const past =
      compareJalali(

        calendarYear,
        calendarMonth,
        day,

        today.year,
        today.month,
        today.day

      ) < 0;


    if (
      friday
    ) {

      button.classList.add(
        "friday"
      );

      button.disabled =
        true;

      button.title =
        "جمعه تعطیل است.";

    }
    else if (
      past
    ) {

      button.classList.add(
        "disabled"
      );

      button.disabled =
        true;

    }
    else {

      button.addEventListener(
        "click",
        function() {

          selectDate(

            calendarYear,

            calendarMonth,

            day

          );

        }
      );

    }


    days.appendChild(
      button
    );

  }

}


/*
=========================================
انتخاب تاریخ
=========================================
*/

function selectDate(
  year,
  month,
  day
) {

  if (
    isFridayJalali(
      year,
      month,
      day
    )
  ) {

    showMessage(
      "روز جمعه آرایشگاه تعطیل است.",
      "error"
    );

    return;

  }


  selectedCalendarYear =
    year;


  selectedCalendarMonth =
    month;


  selectedPersianDay =
    day;


  selectedGregorianDate =
    jalaliToISO(
      year,
      month,
      day
    );


  selectedTime =
    "";


  const g =
    jalaliToGregorian(
      year,
      month,
      day
    );


  const weekday =
    weekdayNames[
      getWeekIndex(
        g.year,
        g.month,
        g.day
      )
    ];


  document.getElementById(
    "selectedDateText"
  ).textContent =

    weekday +
    " " +
    toPersianDigits(day) +
    " " +
    monthNames[
      month - 1
    ] +
    " " +
    toPersianDigits(year);


  renderCalendar();


  loadTimes();


  checkForm();

}


/*
=========================================
ماه بعد
=========================================
*/

document
  .getElementById(
    "nextMonth"
  )
  .addEventListener(
    "click",
    function() {

      calendarMonth++;


      if (
        calendarMonth > 12
      ) {

        calendarMonth = 1;

        calendarYear++;

      }


      renderCalendar();

    }
  );


/*
=========================================
ماه قبل
=========================================
*/

document
  .getElementById(
    "prevMonth"
  )
  .addEventListener(
    "click",
    function() {

      const today =
        getTodayJalali();


      if (
        calendarYear === today.year &&
        calendarMonth === today.month
      ) {

        return;

      }


      calendarMonth--;


      if (
        calendarMonth < 1
      ) {

        calendarMonth = 12;

        calendarYear--;

      }


      renderCalendar();

    }
  );


/*
=========================================
خدمات
=========================================
*/

document
  .querySelectorAll(
    ".service"
  )
  .forEach(
    function(button) {

      button.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(
              ".service"
            )
            .forEach(
              function(item) {

                item.classList.remove(
                  "selected"
                );

              }
            );


          button.classList.add(
            "selected"
          );


          selectedService =
            button.dataset.service;


          checkForm();

        }
      );

    }
  );


/*
=========================================
دریافت ساعت‌ها
=========================================
*/

async function loadTimes() {

  if (
    !selectedGregorianDate
  ) {

    return;

  }


  loadingTimes =
    true;


  selectedTime =
    "";


  checkForm();


  const times =
    document.getElementById(
      "times"
    );


  times.innerHTML =

    `
      <div class="loading">
        در حال بررسی نوبت‌های آزاد...
      </div>
    `;


  try {

    const url =

      GOOGLE_SCRIPT_URL +

      "?action=times" +

      "&date=" +

      encodeURIComponent(
        selectedGregorianDate
      ) +

      "&t=" +

      Date.now();


    const response =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "خطا"
      );

    }


    if (
      data.friday
    ) {

      times.innerHTML =

        `
          <div class="no-times">
            جمعه آرایشگاه تعطیل است.
          </div>
        `;

      return;

    }


    renderTimes(

      data.allTimes || [],

      data.reservedTimes || []

    );

  }
  catch(error) {

    console.error(
      error
    );


    times.innerHTML =

      `
        <div class="no-times">

          دریافت نوبت‌ها انجام نشد.

          <br>

          دوباره تلاش کنید.

        </div>
      `;

  }
  finally {

    loadingTimes =
      false;

    checkForm();

  }

}


/*
=========================================
نمایش ساعت‌ها
=========================================
*/

function renderTimes(
  allTimes,
  reservedTimes
) {

  const times =
    document.getElementById(
      "times"
    );


  times.innerHTML = "";


  if (
    !allTimes.length
  ) {

    times.innerHTML =

      `
        <div class="no-times">
          ساعتی برای این روز تعریف نشده است.
        </div>
      `;

    return;

  }


  allTimes.forEach(
    function(time) {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "time";


      button.textContent =
        toPersianDigits(
          time
        );


      if (
        reservedTimes.includes(
          time
        )
      ) {

        button.classList.add(
          "reserved"
        );


        button.disabled =
          true;


        button.title =
          "این ساعت رزرو شده است.";

      }
      else {

        button.addEventListener(
          "click",
          function() {

            document
              .querySelectorAll(
                ".time"
              )
              .forEach(
                function(item) {

                  item.classList.remove(
                    "selected"
                  );

                }
              );


            button.classList.add(
              "selected"
            );


            selectedTime =
              time;


            checkForm();

          }
        );

      }


      times.appendChild(
        button
      );

    }
  );

}


/*
=========================================
فرم
=========================================
*/

const nameInput =
  document.getElementById(
    "customerName"
  );


const phoneInput =
  document.getElementById(
    "phone"
  );


const submitButton =
  document.getElementById(
    "submitButton"
  );


const message =
  document.getElementById(
    "message"
  );


nameInput.addEventListener(
  "input",
  checkForm
);


phoneInput.addEventListener(
  "input",
  function() {

    phoneInput.value =
      phoneInput.value.replace(
        /\D/g,
        ""
      );


    checkForm();

  }
);


/*
=========================================
بررسی فرم
=========================================
*/

function checkForm() {

  const name =
    nameInput.value.trim();


  const phone =
    phoneInput.value.trim();


  const validPhone =
    /^09\d{9}$/.test(
      phone
    );


  submitButton.disabled = !(
    selectedService &&
    selectedGregorianDate &&
    selectedTime &&
    name &&
    validPhone &&
    !loadingTimes
  );

}


/*
=========================================
پیام
=========================================
*/

function showMessage(
  text,
  type
) {

  message.textContent =
    text;


  message.className =
    "message " +
    type;

}


/*
=========================================
ثبت نوبت
=========================================
*/

submitButton.addEventListener(
  "click",
  bookAppointment
);


async function bookAppointment() {

  if (
    submitButton.disabled
  ) {

    return;

  }


  submitButton.disabled =
    true;


  submitButton.textContent =
    "در حال ثبت...";


  try {

    const params =
      new URLSearchParams();


    params.append(
      "action",
      "book"
    );


    params.append(
      "customerName",
      nameInput.value.trim()
    );


    params.append(
      "phone",
      phoneInput.value.trim()
    );


    params.append(
      "service",
      selectedService
    );


    params.append(
      "date",
      selectedGregorianDate
    );


    params.append(
      "time",
      selectedTime
    );


    const response =
      await fetch(

        GOOGLE_SCRIPT_URL +
        "?" +
        params.toString() +
        "&t=" +
        Date.now(),

        {
          cache:
            "no-store"
        }

      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      showMessage(
        data.message ||
        "ثبت نوبت انجام نشد.",
        "error"
      );


      await loadTimes();


      return;

    }


    /*
    نوبت در انتظار تأیید
    */

    statusToken =
      data.token;


    showPendingStatus();


    /*
    پاک کردن اطلاعات مشتری
    */

    nameInput.value =
      "";

    phoneInput.value =
      "";


    selectedTime =
      "";


    await loadTimes();


    /*
    شروع بررسی وضعیت
    */

    startStatusChecking();

  }
  catch(error) {

    console.error(
      error
    );


    showMessage(
      "ارتباط با سرور برقرار نشد.",
      "error"
    );

  }


  submitButton.textContent =
    "ثبت نوبت";


  checkForm();

}


/*
=========================================
نمایش انتظار تأیید
=========================================
*/

function showPendingStatus() {

  message.className =
    "pending-box";


  message.innerHTML =

    `
      <strong>
        نوبت شما ثبت شد
      </strong>

      <br>

      در انتظار تأیید مدیر آرایشگاه...

      <br>

      لطفاً همین صفحه را باز نگه دارید.
    `;

}


/*
=========================================
بررسی وضعیت
=========================================
*/

function startStatusChecking() {

  if (
    statusTimer
  ) {

    clearInterval(
      statusTimer
    );

  }


  checkAppointmentStatus();


  statusTimer =
    setInterval(
      checkAppointmentStatus,
      4000
    );

}


/*
=========================================
دریافت وضعیت از سرور
=========================================
*/

async function checkAppointmentStatus() {

  if (
    !statusToken
  ) {

    return;

  }


  try {

    const url =

      GOOGLE_SCRIPT_URL +

      "?action=status" +

      "&token=" +

      encodeURIComponent(
        statusToken
      ) +

      "&t=" +

      Date.now();


    const response =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      return;

    }


    if (
      data.status ===
      "pending"
    ) {

      showPendingStatus();

      return;

    }


    if (
      data.status ===
      "approved"
    ) {

      if (
        statusTimer
      ) {

        clearInterval(
          statusTimer
        );

      }


      message.className =
        "approved-box";


      message.innerHTML =

        `
          <strong>
            ✅ نوبت شما با موفقیت رزرو شد
          </strong>

          <br>

          ساعت:
          ${toPersianDigits(
            data.time
          )}

          <br>

          لطفاً در زمان تعیین‌شده
          در MESTER PAX حضور داشته باشید.
        `;


      statusToken =
        "";

      return;

    }


    if (
      data.status ===
      "cancelled"
    ) {

      if (
        statusTimer
      ) {

        clearInterval(
          statusTimer
        );

      }


      message.className =
        "cancelled-box";


      message.innerHTML =

        `
          <strong>
            ❌ نوبت شما لغو شد
          </strong>

          <br>

          این نوبت توسط مدیریت تأیید نشد.
        `;


      statusToken =
        "";

      await loadTimes();

    }

  }
  catch(error) {

    console.error(
      error
    );

  }

}


/*
=========================================
شروع تقویم
=========================================
*/

(function initCalendar() {

  const today =
    getTodayJalali();


  calendarYear =
    today.year;


  calendarMonth =
    today.month;


  renderCalendar();

})();

</script>
