<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MESTER PAX | نوبت‌دهی</title>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #080808,
            #1c1c1c
        );

    color: white;

    min-height: 100vh;
}


.container {

    width: 100%;

    max-width: 520px;

    margin: auto;

    padding:
        25px 18px 50px;
}


/* لوگو */

.logo {

    text-align: center;

    padding:
        25px 0 35px;
}


.logo h1 {

    margin: 0;

    font-size: 38px;

    letter-spacing: 4px;
}


.logo p {

    margin-top: 10px;

    color: #999;

    font-size: 14px;
}


/* کارت */

.card {

    background: #151515;

    border:
        1px solid #292929;

    border-radius: 20px;

    padding: 22px;

    margin-bottom: 18px;
}


.title {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 18px;
}


/* خدمات */

.services {

    display: grid;

    gap: 10px;
}


.service {

    padding: 15px;

    background: #202020;

    border:
        1px solid #333;

    border-radius: 12px;

    cursor: pointer;

    transition: 0.2s;
}


.service:hover {

    border-color: #aaa;
}


.service.selected {

    background: white;

    color: black;

    border-color: white;
}


/* تاریخ */

input {

    width: 100%;

    padding: 14px;

    margin-bottom: 15px;

    border-radius: 12px;

    border:
        1px solid #333;

    background: #202020;

    color: white;

    font-size: 15px;

    outline: none;
}


input:focus {

    border-color: #aaa;
}


/* ساعت */

.times {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}


.time {

    padding: 14px;

    background: #202020;

    border:
        1px solid #333;

    border-radius: 12px;

    color: white;

    cursor: pointer;

    font-size: 15px;
}


.time:hover {

    border-color: #aaa;
}


.time.selected {

    background: white;

    color: black;
}


/* دکمه */

.submit {

    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 14px;

    background: white;

    color: black;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


.submit:disabled {

    opacity: 0.45;

    cursor: not-allowed;
}


/* پیام */

.message {

    display: none;

    padding: 15px;

    margin-bottom: 18px;

    border-radius: 12px;

    text-align: center;
}


.message.success {

    display: block;

    background: #163d24;

    color: #8ff0a4;
}


.message.error {

    display: block;

    background: #451b1b;

    color: #ff9b9b;
}


.loading {

    text-align: center;

    color: #999;

    padding: 15px;
}


/* فوتر */

footer {

    text-align: center;

    color: #666;

    font-size: 12px;

    margin-top: 30px;
}

</style>

</head>


<body>


<div class="container">


<!-- لوگو -->

<div class="logo">

    <h1>MESTER PAX</h1>

    <p>
        مدیریت یوسف قربانی
    </p>

</div>



<!-- پیام -->

<div
    id="message"
    class="message"
></div>



<!-- خدمات -->

<div class="card">

    <div class="title">
        انتخاب خدمت
    </div>


    <div class="services">


        <div
            class="service"
            data-service="کوتاهی مو"
        >
            کوتاهی مو
        </div>


        <div
            class="service"
            data-service="اصلاح ریش"
        >
            اصلاح ریش
        </div>


        <div
            class="service"
            data-service="کوتاهی + اصلاح ریش"
        >
            کوتاهی + اصلاح ریش
        </div>


    </div>

</div>



<!-- تاریخ و ساعت -->

<div class="card">

    <div class="title">
        انتخاب تاریخ و ساعت
    </div>


    <input
        type="date"
        id="date"
    >


    <div
        id="times"
        class="times"
    >

        <div class="loading">
            ابتدا تاریخ را انتخاب کنید
        </div>

    </div>

</div>



<!-- اطلاعات مشتری -->

<div class="card">

    <div class="title">
        اطلاعات مشتری
    </div>


    <input
        type="text"
        id="customerName"
        placeholder="نام و نام خانوادگی"
    >


    <input
        type="tel"
        id="phone"
        placeholder="شماره موبایل"
        maxlength="11"
    >


    <button
        id="submitButton"
        class="submit"
        disabled
    >
        ثبت نوبت
    </button>

</div>



<footer>

    MESTER PAX

    <br>

    مدیریت یوسف قربانی

</footer>


</div>



<script>


// =====================================
// آدرس Google Apps Script
// =====================================

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzn111x1wlJU2ey4WT-q8I7OIZvMyhyK_MlbZST98TCWJ4wix5w8hq4khaDiJPL_I39/exec";


// =====================================
// متغیرها
// =====================================

let selectedService = "";

let selectedTime = "";


// =====================================
// عناصر صفحه
// =====================================

const services =
document.querySelectorAll(".service");


const dateInput =
document.getElementById("date");


const timesContainer =
document.getElementById("times");


const nameInput =
document.getElementById("customerName");


const phoneInput =
document.getElementById("phone");


const submitButton =
document.getElementById("submitButton");


const messageBox =
document.getElementById("message");


// =====================================
// حداقل تاریخ = امروز
// =====================================

const today =
new Date()
.toISOString()
.split("T")[0];


dateInput.min = today;


// =====================================
// انتخاب خدمت
// =====================================

services.forEach(service => {

    service.addEventListener(
        "click",
        function() {

            services.forEach(item => {

                item.classList.remove(
                    "selected"
                );

            });


            service.classList.add(
                "selected"
            );


            selectedService =
                service.dataset.service;


            checkForm();

        }
    );

});


// =====================================
// انتخاب تاریخ
// =====================================

dateInput.addEventListener(
    "change",
    loadTimes
);


async function loadTimes() {

    const date =
        dateInput.value;


    selectedTime = "";


    checkForm();


    if (!date) {

        timesContainer.innerHTML =
        `
        <div class="loading">
            ابتدا تاریخ را انتخاب کنید
        </div>
        `;

        return;
    }


    timesContainer.innerHTML =
    `
    <div class="loading">
        در حال دریافت ساعت‌های آزاد...
    </div>
    `;


    try {

        const response =
        await fetch(
            GOOGLE_SCRIPT_URL +
            "?action=times&date=" +
            encodeURIComponent(date)
        );


        const data =
        await response.json();


        if (!data.success) {

            throw new Error(
                data.message
            );

        }


        renderTimes(
            data.times
        );


    } catch(error) {

        console.error(error);


        timesContainer.innerHTML =
        `
        <div class="loading">
            خطا در دریافت ساعت‌ها
        </div>
        `;

    }

}


// =====================================
// نمایش ساعت‌ها
// =====================================

function renderTimes(times) {

    timesContainer.innerHTML = "";


    if (!times.length) {

        timesContainer.innerHTML =
        `
        <div class="loading">
            برای این تاریخ ساعت خالی وجود ندارد.
        </div>
        `;

        return;
    }


    times.forEach(time => {

        const button =
        document.createElement(
            "button"
        );


        button.type = "button";

        button.className = "time";

        button.textContent = time;


        button.addEventListener(
            "click",
            function() {

                document
                .querySelectorAll(".time")
                .forEach(item => {

                    item.classList.remove(
                        "selected"
                    );

                });


                button.classList.add(
                    "selected"
                );


                selectedTime = time;


                checkForm();

            }
        );


        timesContainer.appendChild(
            button
        );

    });

}


// =====================================
// بررسی فرم
// =====================================

function checkForm() {

    const name =
        nameInput.value.trim();


    const phone =
        phoneInput.value.trim();


    submitButton.disabled =
    !(
        selectedService &&
        dateInput.value &&
        selectedTime &&
        name &&
        /^09\d{9}$/.test(phone)
    );

}


// =====================================
// تغییر نام
// =====================================

nameInput.addEventListener(
    "input",
    checkForm
);


// =====================================
// تغییر شماره
// =====================================

phoneInput.addEventListener(
    "input",
    checkForm
);


// =====================================
// نمایش پیام
// =====================================

function showMessage(
    text,
    type
) {

    messageBox.textContent =
        text;


    messageBox.className =
        "message " + type;

}


// =====================================
// ثبت نوبت
// =====================================

submitButton.addEventListener(
    "click",
    bookAppointment
);


async function bookAppointment() {

    if (submitButton.disabled) {

        return;
    }


    submitButton.disabled =
        true;


    submitButton.textContent =
        "در حال ثبت نوبت...";


    const params =
    new URLSearchParams({

        action: "book",

        customerName:
            nameInput.value.trim(),

        phone:
            phoneInput.value.trim(),

        service:
            selectedService,

        date:
            dateInput.value,

        time:
            selectedTime

    });


    try {

        const response =
        await fetch(
            GOOGLE_SCRIPT_URL +
            "?" +
            params.toString()
        );


        const data =
        await response.json();


        if (!data.success) {

            showMessage(
                data.message ||
                "ثبت نوبت انجام نشد.",
                "error"
            );


            await loadTimes();

            return;
        }


        showMessage(
            "نوبت شما با موفقیت ثبت شد.",
            "success"
        );


        nameInput.value = "";

        phoneInput.value = "";

        selectedTime = "";


        await loadTimes();


        checkForm();


    } catch(error) {

        console.error(error);


        showMessage(
            "خطا در اتصال به سیستم.",
            "error"
        );

    }


    submitButton.textContent =
        "ثبت نوبت";


    checkForm();

}

</script>


</body>

</html>
