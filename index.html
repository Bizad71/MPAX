<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MESTER PAX | نوبت‌دهی</title>


    <!-- Persian Datepicker -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #252525 0%,
                    #111 45%,
                    #050505 100%
                );

            color: #fff;
        }


        .container {

            width: 100%;

            max-width: 520px;

            margin: auto;

            padding:
                20px 16px 50px;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            text-align: center;

            padding:
                30px 0 35px;
        }


        .logo h1 {

            margin: 0;

            font-size: 38px;

            font-weight: 800;

            letter-spacing: 5px;

            color: #fff;
        }


        .logo p {

            margin:
                12px 0 0;

            color: #999;

            font-size: 14px;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {

            display: none;

            padding: 15px;

            margin-bottom: 18px;

            border-radius: 14px;

            text-align: center;

            line-height: 1.8;

            font-size: 14px;
        }


        .message.success {

            display: block;

            background: #12351f;

            color: #8ff0a4;

            border:
                1px solid #245b36;
        }


        .message.error {

            display: block;

            background: #421b1b;

            color: #ff9b9b;

            border:
                1px solid #6b2929;
        }


        /* =========================
           CARD
        ========================= */

        .card {

            background:
                rgba(22, 22, 22, 0.96);

            border:
                1px solid #2c2c2c;

            border-radius: 20px;

            padding: 20px;

            margin-bottom: 18px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.25);
        }


        .title {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 18px;
        }


        /* =========================
           SERVICES
        ========================= */

        .services {

            display: grid;

            gap: 10px;
        }


        .service {

            width: 100%;

            padding: 16px;

            background: #202020;

            border:
                1px solid #343434;

            border-radius: 13px;

            color: #fff;

            cursor: pointer;

            font-size: 15px;

            transition:
                0.2s ease;

            text-align: right;
        }


        .service:hover {

            border-color: #777;

            transform:
                translateY(-1px);
        }


        .service.selected {

            background: #fff;

            color: #000;

            border-color: #fff;

            font-weight: bold;
        }


        /* =========================
           INPUT
        ========================= */

        .input-group {

            margin-bottom: 14px;
        }


        .input-label {

            display: block;

            margin-bottom: 8px;

            color: #aaa;

            font-size: 13px;
        }


        input {

            width: 100%;

            height: 50px;

            padding:
                0 14px;

            border-radius: 12px;

            border:
                1px solid #343434;

            background: #202020;

            color: #fff;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #888;
        }


        input::placeholder {

            color: #777;
        }


        /* =========================
           DATE PICKER
        ========================= */

        #persianDate {

            cursor: pointer;

            text-align: right;
        }


        /* =========================
           TIMES
        ========================= */

        .times {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-top: 5px;
        }


        .time {

            min-height: 50px;

            padding: 12px;

            background: #202020;

            border:
                1px solid #343434;

            border-radius: 12px;

            color: #fff;

            cursor: pointer;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            font-size: 15px;

            transition:
                0.2s ease;
        }


        .time:hover {

            border-color: #888;
        }


        .time.selected {

            background: #fff;

            color: #000;

            border-color: #fff;

            font-weight: bold;
        }


        .loading {

            grid-column:
                1 / -1;

            text-align: center;

            color: #888;

            padding: 18px 5px;

            font-size: 13px;
        }


        .empty {

            grid-column:
                1 / -1;

            text-align: center;

            padding: 18px 5px;

            color: #aaa;

            line-height: 1.8;

            font-size: 13px;
        }


        /* =========================
           SUBMIT
        ========================= */

        .submit {

            width: 100%;

            height: 54px;

            margin-top: 5px;

            border: none;

            border-radius: 14px;

            background: #fff;

            color: #000;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                0.2s ease;
        }


        .submit:hover:not(:disabled) {

            transform:
                translateY(-1px);

            background: #e9e9e9;
        }


        .submit:disabled {

            opacity: 0.4;

            cursor: not-allowed;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            text-align: center;

            color: #666;

            font-size: 12px;

            line-height: 2;

            margin-top: 30px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 400px) {

            .logo h1 {

                font-size: 31px;

                letter-spacing: 3px;
            }


            .card {

                padding: 17px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================
         LOGO
    ========================= -->

    <div class="logo">

        <h1>MESTER PAX</h1>

        <p>
            مدیریت یوسف قربانی
        </p>

    </div>



    <!-- =========================
         MESSAGE
    ========================= -->

    <div
        id="message"
        class="message"
    ></div>



    <!-- =========================
         SERVICE
    ========================= -->

    <div class="card">

        <div class="title">
            انتخاب خدمت
        </div>


        <div class="services">


            <button
                type="button"
                class="service"
                data-service="کوتاهی مو"
            >
                کوتاهی مو
            </button>


            <button
                type="button"
                class="service"
                data-service="اصلاح ریش"
            >
                اصلاح ریش
            </button>


            <button
                type="button"
                class="service"
                data-service="کوتاهی + اصلاح ریش"
            >
                کوتاهی + اصلاح ریش
            </button>


        </div>

    </div>



    <!-- =========================
         DATE & TIME
    ========================= -->

    <div class="card">

        <div class="title">
            انتخاب تاریخ و ساعت
        </div>


        <div class="input-group">

            <label
                class="input-label"
                for="persianDate"
            >
                تاریخ
            </label>


            <input
                type="text"
                id="persianDate"
                placeholder="انتخاب تاریخ"
                readonly
                autocomplete="off"
            >


            <!--
                این input مخفی است.
                تاریخ میلادی برای Backend
                داخل آن قرار می‌گیرد.
            -->

            <input
                type="hidden"
                id="date"
            >

        </div>


        <div
            id="times"
            class="times"
        >

            <div class="loading">
                ابتدا تاریخ را انتخاب کنید
            </div>

        </div>

    </div>



    <!-- =========================
         CUSTOMER
    ========================= -->

    <div class="card">

        <div class="title">
            اطلاعات مشتری
        </div>


        <div class="input-group">

            <label
                class="input-label"
                for="customerName"
            >
                نام و نام خانوادگی
            </label>


            <input
                type="text"
                id="customerName"
                placeholder="مثلاً علی رضایی"
                autocomplete="name"
            >

        </div>



        <div class="input-group">

            <label
                class="input-label"
                for="phone"
            >
                شماره موبایل
            </label>


            <input
                type="tel"
                id="phone"
                placeholder="مثلاً 09123456789"
                maxlength="11"
                inputmode="numeric"
                autocomplete="tel"
            >

        </div>


        <button
            type="button"
            id="submitButton"
            class="submit"
            disabled
        >
            ثبت نوبت
        </button>

    </div>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        MESTER PAX

        <br>

        مدیریت یوسف قربانی

    </footer>


</div>



<!-- =========================
     LIBRARIES
========================= -->

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>



<script>


// =====================================================
// آدرس Google Apps Script
// =====================================================

const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzn111x1wlJU2ey4WT-q8I7OIZvMyhyK_MlbZST98TCWJ4wix5w8hq4khaDiJPL_I39/exec";


// =====================================================
// متغیرهای سیستم
// =====================================================

let selectedService = "";

let selectedTime = "";

let loadingTimes = false;


// =====================================================
// گرفتن عناصر صفحه
// =====================================================

const services =
    document.querySelectorAll(".service");


const persianDateInput =
    document.getElementById(
        "persianDate"
    );


const dateInput =
    document.getElementById(
        "date"
    );


const timesContainer =
    document.getElementById(
        "times"
    );


const nameInput =
    document.getElementById(
        "customerName"
    );


const phoneInput =
    document.getElementById(
        "phone"
    );


const submitButton =
    document.getElementById(
        "submitButton"
    );


const messageBox =
    document.getElementById(
        "message"
    );


// =====================================================
// نمایش پیام
// =====================================================

function showMessage(
    text,
    type
) {

    messageBox.textContent =
        text;


    messageBox.className =
        "message " + type;

}


// =====================================================
// حذف پیام
// =====================================================

function clearMessage() {

    messageBox.textContent = "";

    messageBox.className =
        "message";

}


// =====================================================
// انتخاب خدمت
// =====================================================

services.forEach(
    service => {

        service.addEventListener(
            "click",
            function() {


                services.forEach(
                    item => {

                        item.classList.remove(
                            "selected"
                        );

                    }
                );


                service.classList.add(
                    "selected"
                );


                selectedService =
                    service.dataset.service;


                clearMessage();


                checkForm();

            }
        );

    }
);


// =====================================================
// تقویم شمسی
// =====================================================

$("#persianDate").pDatepicker({

    format: "YYYY/MM/DD",

    autoClose: true,

    initialValue: false,

    observer: true,

    calendar: {

        persian: {

            locale: "fa",

            showHint: false

        }

    },

    toolbox: {

        enabled: true,

        todayButton: {

            enabled: true,

            text: {

                fa: "امروز"

            }

        }

    },

    onSelect: function(unixDate) {


        clearMessage();


        selectedTime = "";


        /*
            تبدیل تاریخ شمسی
            به تاریخ میلادی
        */

        const selected =
            new persianDate(
                unixDate
            );


        const gregorianDate =
            selected
                .toCalendar("gregorian")
                .format("YYYY-MM-DD");


        /*
            ذخیره تاریخ میلادی
            در input مخفی
        */

        dateInput.value =
            gregorianDate;


        /*
            دریافت ساعت‌های آزاد
        */

        loadTimes();


    }

});


// =====================================================
// دریافت ساعت‌های آزاد
// =====================================================

async function loadTimes() {


    const date =
        dateInput.value;


    selectedTime = "";


    checkForm();


    if (!date) {

        timesContainer.innerHTML =
        `
            <div class="loading">
                ابتدا تاریخ را انتخاب کنید
            </div>
        `;

        return;
    }


    if (loadingTimes) {

        return;

    }


    loadingTimes = true;


    timesContainer.innerHTML =
    `
        <div class="loading">
            در حال دریافت ساعت‌های آزاد...
        </div>
    `;


    try {


        const url =
            GOOGLE_SCRIPT_URL +
            "?action=times" +
            "&date=" +
            encodeURIComponent(date) +
            "&t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message ||
                "خطا در دریافت ساعت‌ها"
            );

        }


        renderTimes(
            data.times || []
        );


    }
    catch(error) {


        console.error(
            "Times error:",
            error
        );


        timesContainer.innerHTML =
        `
            <div class="empty">
                دریافت ساعت‌ها با خطا مواجه شد.
                <br>
                دوباره تلاش کنید.
            </div>
        `;


    }
    finally {


        loadingTimes = false;


        checkForm();

    }

}


// =====================================================
// نمایش ساعت‌ها
// =====================================================

function renderTimes(
    times
) {


    timesContainer.innerHTML =
        "";


    if (!times.length) {


        timesContainer.innerHTML =
        `
            <div class="empty">
                برای این تاریخ
                <br>
                ساعت خالی وجود ندارد.
            </div>
        `;


        return;

    }


    times.forEach(
        time => {


            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "time";


            button.textContent =
                time;


            button.addEventListener(
                "click",
                function() {


                    document
                        .querySelectorAll(
                            ".time"
                        )
                        .forEach(
                            item => {

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );


                    button.classList.add(
                        "selected"
                    );


                    selectedTime =
                        time;


                    clearMessage();


                    checkForm();

                }
            );


            timesContainer.appendChild(
                button
            );

        }
    );

}


// =====================================================
// بررسی فرم
// =====================================================

function checkForm() {


    const name =
        nameInput.value.trim();


    const phone =
        phoneInput.value.trim();


    const validPhone =
        /^09\d{9}$/.test(
            phone
        );


    submitButton.disabled =
        !(
            selectedService &&
            dateInput.value &&
            selectedTime &&
            name &&
            validPhone &&
            !loadingTimes
        );

}


// =====================================================
// تغییر نام
// =====================================================

nameInput.addEventListener(
    "input",
    function() {

        checkForm();

    }
);


// =====================================================
// تغییر شماره
// =====================================================

phoneInput.addEventListener(
    "input",
    function() {


        /*
            فقط عدد قبول کن
        */

        phoneInput.value =
            phoneInput.value.replace(
                /\D/g,
                ""
            );


        checkForm();

    }
);


// =====================================================
// ثبت نوبت
// =====================================================

submitButton.addEventListener(
    "click",
    bookAppointment
);


async function bookAppointment() {


    if (
        submitButton.disabled
    ) {

        return;

    }


    /*
        اطلاعات قبل از ارسال
    */

    const customerName =
        nameInput.value.trim();


    const phone =
        phoneInput.value.trim();


    const service =
        selectedService;


    const date =
        dateInput.value;


    const time =
        selectedTime;


    if (
        !customerName ||
        !/^09\d{9}$/.test(phone) ||
        !service ||
        !date ||
        !time
    ) {

        showMessage(
            "لطفاً اطلاعات را کامل وارد کنید.",
            "error"
        );

        return;

    }


    submitButton.disabled =
        true;


    submitButton.textContent =
        "در حال ثبت نوبت...";


    clearMessage();


    try {


        const params =
            new URLSearchParams();


        params.append(
            "action",
            "book"
        );


        params.append(
            "customerName",
            customerName
        );


        params.append(
            "phone",
            phone
        );


        params.append(
            "service",
            service
        );


        params.append(
            "date",
            date
        );


        params.append(
            "time",
            time
        );


        const response =
            await fetch(

                GOOGLE_SCRIPT_URL +
                "?" +
                params.toString(),

                {
                    cache: "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
            اگر ساعت قبلاً
            توسط شخص دیگری گرفته شده
        */

        if (!data.success) {


            showMessage(
                data.message ||
                "ثبت نوبت انجام نشد.",
                "error"
            );


            /*
                دوباره ساعت‌های آزاد
                را دریافت کن
            */

            await loadTimes();


            return;

        }


        /*
            موفقیت
        */

        showMessage(
            "نوبت شما با موفقیت ثبت شد.",
            "success"
        );


        /*
            پاک کردن فرم
        */

        nameInput.value =
            "";


        phoneInput.value =
            "";


        selectedTime =
            "";


        /*
            ساعت‌های آزاد
            دوباره دریافت شوند
        */

        await loadTimes();


        checkForm();


    }
    catch(error) {


        console.error(
            "Booking error:",
            error
        );


        showMessage(
            "خطا در اتصال به سیستم. دوباره تلاش کنید.",
            "error"
        );

    }


    submitButton.textContent =
        "ثبت نوبت";


    checkForm();

}


</script>


</body>

</html>
