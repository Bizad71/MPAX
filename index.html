<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MESTER PAX</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at top,
      #292929 0%,
      #111 45%,
      #070707 100%
    );

  color: #fff;

  font-family:
    Tahoma,
    Arial,
    sans-serif;

}


.container {

  width: 100%;

  max-width: 520px;

  margin: auto;

  padding:
    20px 15px 50px;

}


.logo {

  text-align: center;

  padding:
    28px 0 25px;

}


.logo h1 {

  margin: 0;

  font-size: 38px;

  letter-spacing: 4px;

}


.logo p {

  margin:
    10px 0 0;

  color: #888;

  font-size: 13px;

}


.card {

  background: #171717;

  border:
    1px solid #2b2b2b;

  border-radius: 20px;

  padding: 20px;

  margin-bottom: 16px;

}


.title {

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 17px;

}


.services {

  display: grid;

  gap: 10px;

}


.service {

  width: 100%;

  border:
    1px solid #333;

  background: #222;

  color: #fff;

  border-radius: 12px;

  min-height: 52px;

  font-family: inherit;

  text-align: right;

  padding: 0 16px;

  cursor: pointer;

  font-size: 14px;

}


.service.selected {

  background: #fff;

  color: #000;

  border-color: #fff;

  font-weight: bold;

}


.calendar {

  background: #111;

  border:
    1px solid #292929;

  border-radius: 17px;

  overflow: hidden;

}


.calendar-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 14px;

  border-bottom:
    1px solid #292929;

}


.calendar-title {

  text-align: center;

  font-size: 15px;

  font-weight: bold;

}


.calendar-nav {

  width: 38px;

  height: 38px;

  border: none;

  border-radius: 10px;

  background: #242424;

  color: white;

  font-size: 20px;

  cursor: pointer;

}


.weekdays {

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  padding:
    10px 7px 5px;

  color: #777;

  font-size: 11px;

  text-align: center;

}


.days {

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  gap: 5px;

  padding:
    5px 7px 12px;

}


.day {

  aspect-ratio: 1 / 1;

  min-width: 0;

  border: none;

  border-radius: 10px;

  background: #1d1d1d;

  color: #eee;

  font-family: inherit;

  cursor: pointer;

  font-size: 13px;

}


.day:hover {

  background: #333;

}


.day.empty {

  background: transparent;

  cursor: default;

}


.day.today {

  border:
    1px solid #777;

}


.day.selected {

  background: #fff;

  color: #000;

  font-weight: bold;

}


.day.disabled {

  color: #444;

  background: #151515;

  cursor: not-allowed;

}


.day.friday {

  color: #444;

  background: #101010;

  cursor: not-allowed;

}


.selected-date {

  text-align: center;

  padding:
    12px 10px 0;

  color: #bbb;

  font-size: 13px;

}


.times {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 10px;

  margin-top: 16px;

}


.time {

  min-height: 50px;

  border:
    1px solid #333;

  background: #222;

  color: #fff;

  border-radius: 12px;

  font-family: inherit;

  font-size: 15px;

  cursor: pointer;

}


.time.selected {

  background: #fff;

  color: #000;

  border-color: #fff;

  font-weight: bold;

}


.time.reserved {

  background: #351b1b;

  color: #777;

  border-color: #4b2828;

  cursor: not-allowed;

  text-decoration: line-through;

}


.loading {

  grid-column:
    1 / -1;

  text-align: center;

  color: #777;

  padding: 20px 5px;

  font-size: 13px;

}


.no-times {

  grid-column:
    1 / -1;

  text-align: center;

  color: #777;

  padding: 20px 5px;

  font-size: 13px;

  line-height: 2;

}


.label {

  display: block;

  color: #888;

  font-size: 12px;

  margin:
    0 0 7px;

}


input {

  width: 100%;

  height: 50px;

  margin-bottom: 15px;

  padding:
    0 14px;

  border:
    1px solid #333;

  border-radius: 12px;

  background: #222;

  color: #fff;

  outline: none;

  font-family: inherit;

  font-size: 14px;

}


input:focus {

  border-color: #777;

}


.submit {

  width: 100%;

  height: 54px;

  margin-top: 3px;

  border: none;

  border-radius: 13px;

  background: #fff;

  color: #000;

  font-family: inherit;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}


.submit:disabled {

  opacity: .35;

  cursor: not-allowed;

}


.message {

  display: none;

  padding: 14px;

  border-radius: 12px;

  margin-bottom: 15px;

  text-align: center;

  font-size: 13px;

  line-height: 1.8;

}


.message.success {

  display: block;

  background: #12351e;

  color: #8eeaa2;

}


.message.error {

  display: block;

  background: #401b1b;

  color: #ff9b9b;

}


.message.pending {

  display: block;

  background: #332c13;

  color: #f1d878;

}


.status-card {

  display: none;

  text-align: center;

}


.status-card.show {

  display: block;

}


.status-icon {

  font-size: 42px;

  margin-bottom: 10px;

}


.status-title {

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 8px;

}


.status-text {

  color: #999;

  font-size: 13px;

  line-height: 2;

}


.status-id {

  margin-top: 15px;

  direction: ltr;

  font-size: 12px;

  color: #777;

}


.new-booking {

  width: 100%;

  height: 48px;

  border: 1px solid #333;

  border-radius: 12px;

  background: #222;

  color: #fff;

  font-family: inherit;

  cursor: pointer;

  margin-top: 15px;

}


footer {

  text-align: center;

  color: #555;

  font-size: 11px;

  line-height: 2;

  margin-top: 20px;

}


@media(max-width:380px) {

  .logo h1 {

    font-size: 30px;

  }

  .day {

    font-size: 11px;

  }

}

</style>

</head>

<script>


/* =====================================
   آدرس Apps Script
===================================== */

const GOOGLE_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzn111x1wlJU2ey4WT-q8I7OIZvMyhyK_MlbZST98TCWJ4wix5w8hq4khaDiJPL_I39/exec";


/* =====================================
   اطلاعات تقویم
===================================== */

const monthNames = [

  "فروردین",
  "اردیبهشت",
  "خرداد",
  "تیر",
  "مرداد",
  "شهریور",
  "مهر",
  "آبان",
  "آذر",
  "دی",
  "بهمن",
  "اسفند"

];


const weekdayNames = [

  "شنبه",
  "یکشنبه",
  "دوشنبه",
  "سه‌شنبه",
  "چهارشنبه",
  "پنجشنبه",
  "جمعه"

];


const persianDigits =
  "۰۱۲۳۴۵۶۷۸۹";


/* =====================================
   متغیرها
===================================== */

let selectedService = "";

let selectedTime = "";

let selectedGregorianDate = "";

let selectedPersianYear = 0;

let selectedPersianMonth = 0;

let selectedPersianDay = 0;

let calendarYear = 0;

let calendarMonth = 0;

let loadingTimes = false;

let statusTimer = null;


/* =====================================
   تبدیل عدد به فارسی
===================================== */

function toPersianDigits(value) {

  return String(value).replace(
    /\d/g,
    number =>
      persianDigits[number]
  );

}


/* =====================================
   تبدیل عدد فارسی به انگلیسی
===================================== */

function toEnglishDigits(value) {

  return String(value)
    .replace(
      /[۰-۹]/g,
      digit =>
        String(
          persianDigits.indexOf(
            digit
          )
        )
    );

}


/* =====================================
   تاریخ امروز شمسی
===================================== */

function getTodayJalali() {

  const now =
    new Date();


  const formatter =
    new Intl.DateTimeFormat(
      "fa-IR-u-ca-persian",
      {
        year:
          "numeric",

        month:
          "numeric",

        day:
          "numeric"
      }
    );


  const parts =
    formatter.formatToParts(
      now
    );


  let year = 0;

  let month = 0;

  let day = 0;


  parts.forEach(
    part => {

      if (
        part.type === "year"
      ) {

        year =
          Number(
            toEnglishDigits(
              part.value
            )
          );

      }


      if (
        part.type === "month"
      ) {

        month =
          Number(
            toEnglishDigits(
              part.value
            )
          );

      }


      if (
        part.type === "day"
      ) {

        day =
          Number(
            toEnglishDigits(
              part.value
            )
          );

      }

    }
  );


  return {

    year,
    month,
    day

  };

}


/* =====================================
   تبدیل شمسی به میلادی
   با Intl
===================================== */

function jalaliToGregorian(
  jy,
  jm,
  jd
) {

  /*
   * سال شمسی تقریباً 621 سال
   * با میلادی فاصله دارد.
   *
   * از حوالی 19 مارس شروع می‌کنیم
   * و تاریخ مورد نظر را پیدا می‌کنیم.
   */

  const startYear =
    jy + 621;


  const start =
    new Date(
      startYear,
      2,
      19
    );


  const target =
    jy +
    "-" +
    jm +
    "-" +
    jd;


  for (
    let i = 0;
    i < 370;
    i++
  ) {

    const current =
      new Date(
        start
      );


    current.setDate(
      start.getDate() + i
    );


    const p =
      getJalaliFromDate(
        current
      );


    const currentTarget =
      p.year +
      "-" +
      p.month +
      "-" +
      p.day;


    if (
      currentTarget ===
      target
    ) {

      return {

        year:
          current.getFullYear(),

        month:
          current.getMonth() + 1,

        day:
          current.getDate()

      };

    }

  }


  return null;

}


/* =====================================
   تبدیل میلادی به شمسی با Intl
===================================== */

function getJalaliFromDate(
  date
) {

  const formatter =
    new Intl.DateTimeFormat(
      "fa-IR-u-ca-persian",
      {
        year:
          "numeric",

        month:
          "numeric",

        day:
          "numeric"
      }
    );


  const parts =
    formatter.formatToParts(
      date
    );


  let year = 0;

  let month = 0;

  let day = 0;


  parts.forEach(
    part => {

      if (
        part.type === "year"
      ) {

        year =
          Number(
            toEnglishDigits(
              part.value
            )
          );

      }


      if (
        part.type === "month"
      ) {

        month =
          Number(
            toEnglishDigits(
              part.value
            )
          );

      }


      if (
        part.type === "day"
      ) {

        day =
          Number(
            toEnglishDigits(
              part.value
            )
          );

      }

    }
  );


  return {

    year,
    month,
    day

  };

}


/* =====================================
   تبدیل تاریخ شمسی به ISO
===================================== */

function jalaliToISO(
  year,
  month,
  day
) {

  const g =
    jalaliToGregorian(
      year,
      month,
      day
    );


  if (!g) {

    return "";

  }


  return (

    g.year +
    "-" +
    String(
      g.month
    ).padStart(
      2,
      "0"
    ) +
    "-" +
    String(
      g.day
    ).padStart(
      2,
      "0"
    )

  );

}


/* =====================================
   تعداد روزهای ماه
===================================== */

function getDaysInMonth(
  year,
  month
) {

  if (
    month <= 6
  ) {

    return 31;

  }


  if (
    month <= 11
  ) {

    return 30;

  }


  /*
   * اسفند:
   * با بررسی اول فروردین سال بعد
   */

  const nextYear =
    jalaliToGregorian(
      year + 1,
      1,
      1
    );


  const thisYear =
    jalaliToGregorian(
      year,
      1,
      1
    );


  if (
    !nextYear ||
    !thisYear
  ) {

    return 29;

  }


  const d1 =
    new Date(
      thisYear.year,
      thisYear.month - 1,
      thisYear.day
    );


  const d2 =
    new Date(
      nextYear.year,
      nextYear.month - 1,
      nextYear.day
    );


  const diff =
    Math.round(
      (
        d2 - d1
      ) /
      86400000
    );


  return diff === 366
    ? 30
    : 29;

}


/* =====================================
   روز هفته
   شنبه = 0
===================================== */

function getWeekIndex(
  year,
  month,
  day
) {

  const iso =
    jalaliToGregorian(
      year,
      month,
      day
    );


  if (!iso) {

    return 0;

  }


  const date =
    new Date(
      iso.year,
      iso.month - 1,
      iso.day
    );


  /*
   * JavaScript:
   * Sunday = 0
   *
   * تبدیل به:
   * Saturday = 0
   */

  return (
    date.getDay() + 1
  ) % 7;

}


/* =====================================
   مقایسه تاریخ
===================================== */

function compareJalali(
  y1,
  m1,
  d1,
  y2,
  m2,
  d2
) {

  if (
    y1 !== y2
  ) {

    return y1 - y2;

  }


  if (
    m1 !== m2
  ) {

    return m1 - m2;

  }


  return d1 - d2;

}


/* =====================================
   آیا جمعه است؟
===================================== */

function isFridayJalali(
  year,
  month,
  day
) {

  return (
    getWeekIndex(
      year,
      month,
      day
    ) === 6
  );

}


/* =====================================
   نمایش تقویم
===================================== */

function renderCalendar() {

  const title =
    document.getElementById(
      "calendarTitle"
    );


  const days =
    document.getElementById(
      "days"
    );


  title.textContent =
    monthNames[
      calendarMonth - 1
    ] +
    " " +
    toPersianDigits(
      calendarYear
    );


  days.innerHTML = "";


  const firstWeekday =
    getWeekIndex(
      calendarYear,
      calendarMonth,
      1
    );


  const totalDays =
    getDaysInMonth(
      calendarYear,
      calendarMonth
    );


  const today =
    getTodayJalali();


  /*
   * خانه‌های خالی
   */

  for (
    let i = 0;
    i < firstWeekday;
    i++
  ) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "day empty";


    days.appendChild(
      empty
    );

  }


  /*
   * روزها
   */

  for (
    let day = 1;
    day <= totalDays;
    day++
  ) {

    const button =
      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "day";


    button.textContent =
      toPersianDigits(
        day
      );


    const weekIndex =
      getWeekIndex(
        calendarYear,
        calendarMonth,
        day
      );


    /*
     * امروز
     */

    if (

      calendarYear ===
        today.year &&

      calendarMonth ===
        today.month &&

      day ===
        today.day

    ) {

      button.classList.add(
        "today"
      );

    }


    /*
     * انتخاب شده
     */

    if (

      calendarYear ===
        selectedPersianYear &&

      calendarMonth ===
        selectedPersianMonth &&

      day ===
        selectedPersianDay

    ) {

      button.classList.add(
        "selected"
      );

    }


    /*
     * جمعه
     */

    if (
      weekIndex === 6
    ) {

      button.classList.add(
        "friday"
      );


      button.disabled =
        true;


      button.title =
        "جمعه آرایشگاه تعطیل است.";

    }


    /*
     * تاریخ گذشته
     */

    const isPast =
      compareJalali(

        calendarYear,
        calendarMonth,
        day,

        today.year,
        today.month,
        today.day

      ) < 0;


    if (
      isPast
    ) {

      button.classList.add(
        "disabled"
      );


      button.disabled =
        true;

    }


    /*
     * تاریخ آینده
     */

    if (
      !isPast &&
      weekIndex !== 6
    ) {

      button.addEventListener(
        "click",
        function() {

          selectDate(

            calendarYear,
            calendarMonth,
            day

          );

        }
      );

    }


    days.appendChild(
      button
    );

  }

}


/* =====================================
   انتخاب تاریخ
===================================== */

function selectDate(
  year,
  month,
  day
) {

  selectedPersianYear =
    year;


  selectedPersianMonth =
    month;


  selectedPersianDay =
    day;


  selectedGregorianDate =
    jalaliToISO(
      year,
      month,
      day
    );


  selectedTime =
    "";


  const weekdayIndex =
    getWeekIndex(
      year,
      month,
      day
    );


  document.getElementById(
    "selectedDateText"
  ).textContent =

    weekdayNames[
      weekdayIndex
    ] +

    " " +

    toPersianDigits(
      day
    ) +

    " " +

    monthNames[
      month - 1
    ] +

    " " +

    toPersianDigits(
      year
    );


  renderCalendar();


  loadTimes();


  checkForm();

}


/* =====================================
   ماه قبل
===================================== */

document
  .getElementById(
    "prevMonth"
  )
  .addEventListener(
    "click",
    function() {

      const today =
        getTodayJalali();


      /*
       * ماه قبل از ماه جاری ممنوع
       */

      if (

        calendarYear ===
          today.year &&

        calendarMonth ===
          today.month

      ) {

        return;

      }


      calendarMonth--;


      if (
        calendarMonth < 1
      ) {

        calendarMonth = 12;

        calendarYear--;

      }


      renderCalendar();

    }
  );


/* =====================================
   ماه بعد
===================================== */

document
  .getElementById(
    "nextMonth"
  )
  .addEventListener(
    "click",
    function() {

      calendarMonth++;


      if (
        calendarMonth > 12
      ) {

        calendarMonth = 1;

        calendarYear++;

      }


      renderCalendar();

    }
  );


/* =====================================
   خدمات
===================================== */

document
  .querySelectorAll(
    ".service"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(
              ".service"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "selected"
                );

              }
            );


          button.classList.add(
            "selected"
          );


          selectedService =
            button.dataset.service;


          checkForm();

        }
      );

    }
  );


/* =====================================
   دریافت ساعت‌ها
===================================== */

async function loadTimes() {

  if (
    !selectedGregorianDate
  ) {

    return;

  }


  if (
    loadingTimes
  ) {

    return;

  }


  loadingTimes =
    true;


  selectedTime =
    "";


  checkForm();


  const times =
    document.getElementById(
      "times"
    );


  times.innerHTML =

    `<div class="loading">
      در حال بررسی نوبت‌های آزاد...
    </div>`;


  try {

    const url =

      GOOGLE_SCRIPT_URL +

      "?action=times" +

      "&date=" +

      encodeURIComponent(
        selectedGregorianDate
      ) +

      "&t=" +

      Date.now();


    const response =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "خطا"
      );

    }


    if (
      data.friday
    ) {

      times.innerHTML =

        `<div class="no-times">
          جمعه آرایشگاه تعطیل است.
        </div>`;


      return;

    }


    renderTimes(

      data.allTimes || [],

      data.reservedTimes || []

    );

  }

  catch(error) {

    console.error(
      error
    );


    times.innerHTML =

      `<div class="no-times">
        دریافت نوبت‌ها انجام نشد.
        <br>
        دوباره تلاش کنید.
      </div>`;

  }

  finally {

    loadingTimes =
      false;

    checkForm();

  }

}


/* =====================================
   نمایش ساعت‌ها
===================================== */

function renderTimes(
  allTimes,
  reservedTimes
) {

  const times =
    document.getElementById(
      "times"
    );


  times.innerHTML = "";


  if (
    !allTimes.length
  ) {

    times.innerHTML =

      `<div class="no-times">
        ساعتی برای این روز باقی نمانده است.
      </div>`;


    return;

  }


  allTimes.forEach(
    time => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "time";


      button.textContent =
        toPersianDigits(
          time
        );


      /*
       * رزرو شده
       */

      if (
        reservedTimes.includes(
          time
        )
      ) {

        button.classList.add(
          "reserved"
        );


        button.disabled =
          true;


        button.title =
          "این ساعت رزرو شده است.";

      }


      /*
       * آزاد
       */

      else {

        button.addEventListener(
          "click",
          function() {

            document
              .querySelectorAll(
                ".time"
              )
              .forEach(
                item => {

                  item.classList.remove(
                    "selected"
                  );

                }
              );


            button.classList.add(
              "selected"
            );


            selectedTime =
              time;


            checkForm();

          }
        );

      }


      times.appendChild(
        button
      );

    }
  );

}


/* =====================================
   عناصر فرم
===================================== */

const nameInput =
  document.getElementById(
    "customerName"
  );


const phoneInput =
  document.getElementById(
    "phone"
  );


const submitButton =
  document.getElementById(
    "submitButton"
  );


const message =
  document.getElementById(
    "message"
  );


/* =====================================
   ورودی‌ها
===================================== */

nameInput.addEventListener(
  "input",
  checkForm
);


phoneInput.addEventListener(
  "input",
  function() {

    phoneInput.value =
      phoneInput.value.replace(
        /[^0-9]/g,
        ""
      );


    checkForm();

  }
);


/* =====================================
   بررسی فرم
===================================== */

function checkForm() {

  const name =
    nameInput.value.trim();


  const phone =
    phoneInput.value.trim();


  const validPhone =
    /^09\d{9}$/.test(
      phone
    );


  submitButton.disabled = !(
    selectedService &&
    selectedGregorianDate &&
    selectedTime &&
    name &&
    validPhone &&
    !loadingTimes
  );

}


/* =====================================
   پیام
===================================== */

function showMessage(
  text,
  type
) {

  message.textContent =
    text;


  message.className =
    "message " +
    type;

}


/* =====================================
   ثبت نوبت
===================================== */

submitButton.addEventListener(
  "click",
  bookAppointment
);


async function bookAppointment() {

  if (
    submitButton.disabled
  ) {

    return;

  }


  submitButton.disabled =
    true;


  submitButton.textContent =
    "در حال ثبت...";


  try {

    const params =
      new URLSearchParams();


    params.append(
      "action",
      "book"
    );


    params.append(
      "customerName",
      nameInput.value.trim()
    );


    params.append(
      "phone",
      phoneInput.value.trim()
    );


    params.append(
      "service",
      selectedService
    );


    params.append(
      "date",
      selectedGregorianDate
    );


    params.append(
      "time",
      selectedTime
    );


    const response =
      await fetch(

        GOOGLE_SCRIPT_URL +
        "?" +
        params.toString() +
        "&t=" +
        Date.now(),

        {
          cache:
            "no-store"
        }

      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      showMessage(

        data.message ||
        "ثبت نوبت انجام نشد.",

        "error"

      );


      await loadTimes();


      return;

    }


    /*
     * نوبت در حالت pending است.
     */

    const appointmentID =
      data.id;


    localStorage.setItem(

      "mesterPaxAppointmentID",

      appointmentID

    );


    /*
     * نمایش وضعیت
     */

    showAppointmentStatus(
      appointmentID
    );


  }

  catch(error) {

    console.error(
      error
    );


    showMessage(

      "ارتباط با سرور برقرار نشد.",

      "error"

    );

  }


  submitButton.textContent =
    "ثبت نوبت";


  checkForm();

}


/* =====================================
   نمایش صفحه وضعیت
===================================== */

function showAppointmentStatus(
  id
) {

  document
    .getElementById(
      "bookingArea"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "statusCard"
    )
    .classList.add(
      "show"
    );


  document
    .getElementById(
      "statusIcon"
    )
    .textContent =
      "⏳";


  document
    .getElementById(
      "statusTitle"
    )
    .textContent =
      "در انتظار تأیید مدیر";


  document
    .getElementById(
      "statusText"
    )
    .innerHTML =
      "نوبت شما ثبت شده است.<br>منتظر تأیید مدیر باشید.";


  document
    .getElementById(
      "statusId"
    )
    .textContent =
      "ID: " + id;


  startStatusPolling(
    id
  );

}


/* =====================================
   بررسی وضعیت
===================================== */

function startStatusPolling(
  id
) {

  if (
    statusTimer
  ) {

    clearInterval(
      statusTimer
    );

  }


  checkAppointmentStatus(
    id
  );


  /*
   * هر 3 ثانیه
   */

  statusTimer =
    setInterval(

      function() {

        checkAppointmentStatus(
          id
        );

      },

      3000

    );

}


/* =====================================
   دریافت وضعیت از Apps Script
===================================== */

async function checkAppointmentStatus(
  id
) {

  try {

    const url =

      GOOGLE_SCRIPT_URL +

      "?action=status" +

      "&id=" +

      encodeURIComponent(
        id
      ) +

      "&t=" +

      Date.now();


    const response =
      await fetch(

        url,

        {
          cache:
            "no-store"
        }

      );


    const data =
      await response.json();


    if (
      !data.success ||
      !data.appointment
    ) {

      return;

    }


    const status =
      data.appointment.status;


    /*
     * تأیید شده
     */

    if (
      status ===
      "approved"
    ) {

      showApprovedStatus(
        data.appointment
      );


      return;

    }


    /*
     * لغو شده
     */

    if (
      status ===
      "cancelled"
    ) {

      showCancelledStatus(
        data.appointment
      );


      return;

    }


  }

  catch(error) {

    console.error(
      error
    );

  }

}


/* =====================================
   وضعیت تأیید شده
===================================== */

function showApprovedStatus(
  appointment
) {

  if (
    statusTimer
  ) {

    clearInterval(
      statusTimer
    );

    statusTimer =
      null;

  }


  document
    .getElementById(
      "statusIcon"
    )
    .textContent =
      "✅";


  document
    .getElementById(
      "statusTitle"
    )
    .textContent =
      "نوبت شما با موفقیت رزرو شد";


  document
    .getElementById(
      "statusText"
    )
    .innerHTML =

      "نوبت شما توسط مدیر تأیید شد." +

      "<br>" +

      "ساعت: " +

      toPersianDigits(
        appointment.time
      );


  document
    .getElementById(
      "statusId"
    )
    .textContent =
      "ID: " +
      appointment.id;

}


/* =====================================
   وضعیت لغو شده
===================================== */

function showCancelledStatus(
  appointment
) {

  if (
    statusTimer
  ) {

    clearInterval(
      statusTimer
    );

    statusTimer =
      null;

  }


  document
    .getElementById(
      "statusIcon"
    )
    .textContent =
      "❌";


  document
    .getElementById(
      "statusTitle"
    )
    .textContent =
      "نوبت لغو شد";


  document
    .getElementById(
      "statusText"
    )
    .innerHTML =
      "متأسفانه مدیر نوبت شما را تأیید نکرد.";


  document
    .getElementById(
      "statusId"
    )
    .textContent =
      "ID: " +
      appointment.id;

}


/* =====================================
   ثبت نوبت جدید
===================================== */

document
  .getElementById(
    "newBookingButton"
  )
  .addEventListener(
    "click",
    function() {

      if (
        statusTimer
      ) {

        clearInterval(
          statusTimer
        );

        statusTimer =
          null;

      }


      localStorage.removeItem(
        "mesterPaxAppointmentID"
      );


      document
        .getElementById(
          "statusCard"
        )
        .classList.remove(
          "show"
        );


      document
        .getElementById(
          "bookingArea"
        )
        .style.display =
          "block";


      selectedService =
        "";

      selectedTime =
        "";

      selectedGregorianDate =
        "";

      selectedPersianDay =
        0;


      document
        .querySelectorAll(
          ".service"
        )
        .forEach(
          item => {

            item.classList.remove(
              "selected"
            );

          }
        );


      nameInput.value =
        "";

      phoneInput.value =
        "";


      document
        .getElementById(
          "selectedDateText"
        )
        .textContent =
          "تاریخ انتخاب نشده";


      document
        .getElementById(
          "times"
        )
        .innerHTML =

          `<div class="no-times">
            ابتدا یک تاریخ را انتخاب کنید
          </div>`;


      checkForm();


    }
  );


/* =====================================
   شروع برنامه
===================================== */

(function init() {

  const today =
    getTodayJalali();


  calendarYear =
    today.year;


  calendarMonth =
    today.month;


  renderCalendar();


  /*
   * اگر مشتری قبلاً نوبتی ثبت کرده
   * بود، وضعیت آن را دوباره نمایش بده.
   */

  const savedID =
    localStorage.getItem(
      "mesterPaxAppointmentID"
    );


  if (
    savedID
  ) {

    checkSavedAppointment(
      savedID
    );

  }

})();


/* =====================================
   بررسی نوبت ذخیره‌شده
===================================== */

async function checkSavedAppointment(
  id
) {

  try {

    const response =
      await fetch(

        GOOGLE_SCRIPT_URL +

        "?action=status" +

        "&id=" +

        encodeURIComponent(
          id
        ) +

        "&t=" +

        Date.now(),

        {
          cache:
            "no-store"
        }

      );


    const data =
      await response.json();


    if (
      data.success &&
      data.appointment
    ) {

      showAppointmentStatus(
        id
      );


      /*
       * وضعیت نهایی را
       * همان لحظه بررسی کن.
       */

      if (
        data.appointment.status ===
        "approved"
      ) {

        showApprovedStatus(
          data.appointment
        );

      }


      if (
        data.appointment.status ===
        "cancelled"
      ) {

        showCancelledStatus(
          data.appointment
        );

      }

    }

  }

  catch(error) {

    console.error(
      error
    );

  }

}
