<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MESTER PAX</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #292929 0%,
            #111 45%,
            #070707 100%
        );

    color: #fff;

    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

.container {

    width: 100%;

    max-width: 520px;

    margin: auto;

    padding:
        20px 15px 50px;
}

.logo {

    text-align: center;

    padding:
        28px 0 25px;
}

.logo h1 {

    margin: 0;

    font-size: 38px;

    letter-spacing: 4px;
}

.logo p {

    margin:
        10px 0 0;

    color: #888;

    font-size: 13px;
}

.card {

    background: #171717;

    border:
        1px solid #2b2b2b;

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 16px;
}

.title {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 17px;
}


/* خدمات */

.services {

    display: grid;

    gap: 10px;
}

.service {

    width: 100%;

    border:
        1px solid #333;

    background: #222;

    color: #fff;

    border-radius: 12px;

    min-height: 52px;

    font-family: inherit;

    text-align: right;

    padding: 0 16px;

    cursor: pointer;

    font-size: 14px;
}

.service.selected {

    background: #fff;

    color: #000;

    border-color: #fff;

    font-weight: bold;
}


/* تقویم */

.calendar {

    background: #111;

    border:
        1px solid #292929;

    border-radius: 17px;

    overflow: hidden;
}

.calendar-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 14px;

    border-bottom:
        1px solid #292929;
}

.calendar-title {

    text-align: center;

    font-size: 15px;

    font-weight: bold;
}

.calendar-nav {

    width: 38px;

    height: 38px;

    border: none;

    border-radius: 10px;

    background: #242424;

    color: white;

    font-size: 20px;

    cursor: pointer;
}

.weekdays {

    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    padding:
        10px 7px 5px;

    color: #777;

    font-size: 11px;

    text-align: center;
}

.days {

    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 5px;

    padding:
        5px 7px 12px;
}

.day {

    aspect-ratio: 1 / 1;

    min-width: 0;

    border: none;

    border-radius: 10px;

    background: #1d1d1d;

    color: #eee;

    font-family: inherit;

    cursor: pointer;

    font-size: 13px;
}

.day:hover {

    background: #333;
}

.day.empty {

    background: transparent;

    cursor: default;
}

.day.today {

    border:
        1px solid #777;
}

.day.selected {

    background: #fff;

    color: #000;

    font-weight: bold;
}

.day.disabled {

    color: #444;

    background: #151515;

    cursor: not-allowed;
}


/* جمعه */

.day.friday {

    background: #251515;

    color: #555;

    cursor: not-allowed;
}

.selected-date {

    text-align: center;

    padding:
        12px 10px 0;

    color: #bbb;

    font-size: 13px;
}


/* ساعت‌ها */

.times {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin-top: 16px;
}

.time {

    min-height: 50px;

    border:
        1px solid #333;

    background: #222;

    color: #fff;

    border-radius: 12px;

    font-family: inherit;

    font-size: 15px;

    cursor: pointer;
}

.time.selected {

    background: #fff;

    color: #000;

    border-color: #fff;

    font-weight: bold;
}

.time.reserved {

    background: #351b1b;

    color: #777;

    border-color: #4b2828;

    cursor: not-allowed;

    text-decoration: line-through;
}

.loading {

    grid-column:
        1 / -1;

    text-align: center;

    color: #777;

    padding: 20px 5px;

    font-size: 13px;
}

.no-times {

    grid-column:
        1 / -1;

    text-align: center;

    color: #777;

    padding: 20px 5px;

    font-size: 13px;

    line-height: 2;
}


/* فرم */

.label {

    display: block;

    color: #888;

    font-size: 12px;

    margin:
        0 0 7px;
}

input {

    width: 100%;

    height: 50px;

    margin-bottom: 15px;

    padding:
        0 14px;

    border:
        1px solid #333;

    border-radius: 12px;

    background: #222;

    color: #fff;

    outline: none;

    font-family: inherit;

    font-size: 14px;
}

input:focus {

    border-color: #777;
}

.submit {

    width: 100%;

    height: 54px;

    margin-top: 3px;

    border: none;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-family: inherit;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.submit:disabled {

    opacity: .35;

    cursor: not-allowed;
}


/* پیام */

.message {

    display: none;

    padding: 14px;

    border-radius: 12px;

    margin-bottom: 15px;

    text-align: center;

    font-size: 13px;

    line-height: 2;
}

.message.success {

    display: block;

    background: #12351e;

    color: #8eeaa2;
}

.message.error {

    display: block;

    background: #401b1b;

    color: #ff9b9b;
}

.message.pending {

    display: block;

    background: #302b12;

    color: #eadc87;
}

.message.cancelled {

    display: block;

    background: #401b1b;

    color: #ff9b9b;
}


/* وضعیت نوبت */

.booking-status {

    display: none;

    text-align: center;

    margin-top: 15px;

    padding: 15px;

    border-radius: 14px;

    line-height: 2;

    font-size: 13px;
}

.booking-status.pending {

    display: block;

    background: #302b12;

    color: #eadc87;
}

.booking-status.success {

    display: block;

    background: #12351e;

    color: #8eeaa2;
}

.booking-status.cancelled {

    display: block;

    background: #401b1b;

    color: #ff9b9b;
}

.booking-id {

    display: block;

    direction: ltr;

    margin-top: 5px;

    font-size: 12px;

    opacity: .7;
}

footer {

    text-align: center;

    color: #555;

    font-size: 11px;

    line-height: 2;

    margin-top: 20px;
}

@media(max-width:380px) {

    .logo h1 {

        font-size: 30px;

    }

    .day {

        font-size: 11px;

    }

}

</style>

</head>


<body>


<div class="container">


<div class="logo">

    <h1>MESTER PAX</h1>

    <p>
        مدیریت یوسف قربانی
    </p>

</div>


<div
    id="message"
    class="message"
></div>


<!-- خدمات -->

<div class="card">

    <div class="title">
        انتخاب خدمت
    </div>

    <div class="services">

        <button
            type="button"
            class="service"
            data-service="کوتاهی مو"
        >
            کوتاهی مو
        </button>

        <button
            type="button"
            class="service"
            data-service="اصلاح ریش"
        >
            اصلاح ریش
        </button>

        <button
            type="button"
            class="service"
            data-service="کوتاهی + اصلاح ریش"
        >
            کوتاهی + اصلاح ریش
        </button>

    </div>

<!-- تقویم -->

<div class="card">

    <div class="calendar">

        <div class="calendar-header">

            <button

            </button>

        <div class="weekdays">

            <div>شنبه</div>
            <div>یکشنبه</div>

        </div>

</div>


<!-- اطلاعات مشتری -->

<div class="card">

    <div class="title">
        اطلاعات مشتری
    </div>


    <label class="label">
        نام مشتری
    </label>

    <input
        id="customerName"
        type="text"
        placeholder="مثلاً علی رضایی"
    >


    <label class="label">
        شماره موبایل
    </label>

    <input
        id="phone"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        placeholder="09123456789"
    >


    <button
        type="button"
        id="submitButton"
        class="submit"
        disabled
    >
        ثبت نوبت
    </button>


    <div
        id="bookingStatus"
        class="booking-status"
    ></div>

</div>


<footer>

    MESTER PAX

    <br>

    مدیریت یوسف قربانی

</footer>


</div>


<script>

/* =========================================
   آدرس Google Apps Script
========================================= */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzn111x1wlJU2ey4WT-q8I7OIZvMyhyK_MlbZST98TCWJ4wix5w8hq4khaDiJPL_I39/exec";


/* =========================================
   نام ماه‌ها
========================================= */

const monthNames = [

    "فروردین",
    "اردیبهشت",
    "خرداد",
    "تیر",
    "مرداد",
    "شهریور",
    "مهر",
    "آبان",
    "آذر",
    "دی",
    "بهمن",
    "اسفند"

];


const persianDigits =
"۰۱۲۳۴۵۶۷۸۹";


/* =========================================
   متغیرها
========================================= */

let selectedService = "";

let selectedTime = "";

let selectedGregorianDate = "";

let selectedPersianDate = null;

let calendarFirstGregorian = null;

let loadingTimes = false;

let bookingId = "";

let statusTimer = null;


/* =========================================
   تبدیل عدد به فارسی
========================================= */

function toPersianDigits(value) {

    return String(value).replace(
        /\d/g,
        function(digit) {

            return persianDigits[
                Number(digit)
            ];

        }
    );

}


/* =========================================
   تبدیل عدد فارسی به انگلیسی
========================================= */

function toEnglishDigits(value) {

    return String(value)
        .replace(
            /[۰-۹]/g,
            function(digit) {

                return String(
                    persianDigits.indexOf(
                        digit
                    )
                );

            }
        );

}


/* =========================================
   تبدیل میلادی به شمسی
========================================= */

function gregorianToJalali(
    gy,
    gm,
    gd
) {

    const gdm = [
        0,
        31,
        59,
        90,
        120,
        151,
        181,
        212,
        243,
        273,
        304,
        334
    ];


    let jy =
        gy > 1600
            ? 979
            : 0;


    let gy2 =
        gy > 1600
            ? gy - 1600
            : gy - 621;


    let gy3 =
        gm > 2
            ? gy2 + 1
            : gy2;


    let days =
        365 * gy2;


    days +=
        Math.floor(
            (gy3 + 3) / 4
        );


    days -=
        Math.floor(
            (gy3 + 99) / 100
        );


    days +=
        Math.floor(
            (gy3 + 399) / 400
        );


    days += gd;

    days += gdm[gm - 1];


    if (
        gm > 2 &&
        (
            gy % 4 === 0 &&
            (
                gy % 100 !== 0 ||
                gy % 400 === 0
            )
        )
    ) {

        days++;

    }


    days -= 79;


    const jNp =
        Math.floor(
            days / 12053
        );


    days %= 12053;


    jy +=
        33 * jNp;


    jy +=
        4 *
        Math.floor(
            days / 1461
        );


    days %= 1461;


    if (days >= 366) {

        jy +=
            Math.floor(
                (days - 1) / 365
            );

        days =
            (days - 1) % 365;

    }


    let jm;

    let jd;


    if (days < 186) {

        jm =
            1 +
            Math.floor(
                days / 31
            );

        jd =
            1 +
            days % 31;

    }

    else {

        jm =
            7 +
            Math.floor(
                (days - 186) / 30
            );

        jd =
            1 +
            ((days - 186) % 30);

    }


    return {

        year: jy,

        month: jm,

        day: jd

    };

}


/* =========================================
   تاریخ امروز
========================================= */

function getToday() {

    const now =
        new Date();


    return {

        year:
            now.getFullYear(),

        month:
            now.getMonth() + 1,

        day:
            now.getDate()

    };

}


/* =========================================
   ISO
========================================= */

function dateToISO(date) {

    return (
        date.getFullYear() +
        "-" +
        String(
            date.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            date.getDate()
        ).padStart(2, "0")
    );

}


/* =========================================
   شروع ماه شمسی
========================================= */

function findPersianMonthStart(
    date
) {

    const d =
        new Date(date);


    d.setHours(
        12,
        0,
        0,
        0
    );


    for (
        let i = 0;
        i < 32;
        i++
    ) {

        const j =
            gregorianToJalali(
                d.getFullYear(),
                d.getMonth() + 1,
                d.getDate()
            );


        if (j.day === 1) {

            return new Date(d);

        }


        d.setDate(
            d.getDate() - 1
        );

    }


    return new Date(date);

}


/* =========================================
   ماه بعد
========================================= */

function nextPersianMonthStart(
    start
) {

    const d =
        new Date(start);


    d.setDate(
        d.getDate() + 32
    );


    return findPersianMonthStart(d);

}


/* =========================================
   ماه قبل
========================================= */

function previousPersianMonthStart(
    start
) {

    const d =
        new Date(start);


    d.setDate(
        d.getDate() - 2
    );


    return findPersianMonthStart(d);

}


/* =========================================
   مقایسه تاریخ
========================================= */

function dateOnly(date) {

    return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );

}


/* =========================================
   رسم تقویم
========================================= */

function renderCalendar() {

    const days =
        document.getElementById(
            "days"
        );


    const title =
        document.getElementById(
            "calendarTitle"
        );


    days.innerHTML = "";


    const first =
        new Date(
            calendarFirstGregorian
        );


    const firstJ =
        gregorianToJalali(
            first.getFullYear(),
            first.getMonth() + 1,
            first.getDate()
        );


    title.textContent =
        monthNames[
            firstJ.month - 1
        ]
        +
        " "
        +
        toPersianDigits(
            firstJ.year
        );


    /*
      روز هفته اول ماه
      شنبه = 0
    */

    const firstWeekday =
        (
            first.getDay() + 1
        ) % 7;


    /*
      پیدا کردن تعداد روز ماه
    */

    const nextMonth =
        nextPersianMonthStart(
            first
        );


    const totalDays =
        Math.round(
            (
                nextMonth - first
            ) / 86400000
        );


    const today =
        dateOnly(
            new Date()
        );


    /*
      خانه‌های خالی
    */

    for (
        let i = 0;
        i < firstWeekday;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "day empty";


        days.appendChild(
            empty
        );

    }


    /*
      روزها
    */

    for (
        let i = 0;
        i < totalDays;
        i++
    ) {

        const current =
            new Date(first);


        current.setDate(
            first.getDate() + i
        );


        const j =
            gregorianToJalali(
                current.getFullYear(),
                current.getMonth() + 1,
                current.getDate()
            );


        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =
            "day";


        button.textContent =
            toPersianDigits(
                j.day
            );


        /*
          امروز
        */

        if (
            dateOnly(current).getTime() ===
            today.getTime()
        ) {

            button.classList.add(
                "today"
            );

        }


        /*
          جمعه
        */

        const isFriday =
            current.getDay() === 5;


        if (isFriday) {

            button.classList.add(
                "friday"
            );

            button.disabled =
                true;

            button.title =
                "جمعه تعطیل است.";

        }


        /*
          تاریخ گذشته
        */

        if (
            dateOnly(current) <
            today
        ) {

            button.classList.add(
                "disabled"
            );

            button.disabled =
                true;

        }


        /*
          تاریخ انتخاب‌شده
        */

        if (
            selectedGregorianDate ===
            dateToISO(current)
        ) {

            button.classList.add(
                "selected"
            );

        }


        /*
          انتخاب
        */

        if (
            !button.disabled
        ) {

            button.addEventListener(
                "click",
                function() {

                    selectDate(
                        current
                    );

                }
            );

        }


        days.appendChild(
            button
        );

    }

}


/* =========================================
   انتخاب تاریخ
========================================= */

function selectDate(
    date
) {

    if (
        date.getDay() === 5
    ) {

        return;

    }


    selectedGregorianDate =
        dateToISO(date);


    selectedPersianDate =
        gregorianToJalali(
            date.getFullYear(),
            date.getMonth() + 1,
            date.getDate()
        );


    selectedTime = "";


    const weekdayNames = [

        "یکشنبه",
        "دوشنبه",
        "سه‌شنبه",
        "چهارشنبه",
        "پنجشنبه",
        "جمعه",
        "شنبه"

    ];


    const text =

        weekdayNames[
            date.getDay()
        ]
        +
        " "
        +
        toPersianDigits(
            selectedPersianDate.day
        )
        +
        " "
        +
        monthNames[
            selectedPersianDate.month - 1
        ]
        +
        " "
        +
        toPersianDigits(
            selectedPersianDate.year
        );


    document.getElementById(
        "selectedDateText"
    ).textContent =
        text;


    renderCalendar();


    loadTimes();


    checkForm();

}


/* =========================================
   ماه قبل
========================================= */

document
    .getElementById(
        "prevMonth"
    )
    .addEventListener(
        "click",
        function() {

            const today =
                dateOnly(
                    new Date()
                );


            const currentStart =
                dateOnly(
                    calendarFirstGregorian
                );


            const todayStart =
                findPersianMonthStart(
                    today
                );


            if (
                currentStart.getTime() <=
                todayStart.getTime()
            ) {

                return;

            }


            calendarFirstGregorian =
                previousPersianMonthStart(
                    calendarFirstGregorian
                );


            renderCalendar();

        }
    );


/* =========================================
   ماه بعد
========================================= */

document
    .getElementById(
        "nextMonth"
    )
    .addEventListener(
        "click",
        function() {

            calendarFirstGregorian =
                nextPersianMonthStart(
                    calendarFirstGregorian
                );


            renderCalendar();

        }
    );


/* =========================================
   خدمات
========================================= */

document
    .querySelectorAll(
        ".service"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(
                            ".service"
                        )
                        .forEach(
                            item => {

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );


                    button.classList.add(
                        "selected"
                    );


                    selectedService =
                        button.dataset.service;


                    checkForm();

                }
            );

        }
    );


/* =========================================
   دریافت ساعت‌ها
========================================= */

async function loadTimes() {

    if (
        !selectedGregorianDate
    ) {

        return;

    }


    if (loadingTimes) {

        return;

    }


    loadingTimes = true;


    selectedTime = "";


    checkForm();


    const times =
        document.getElementById(
            "times"
        );


    times.innerHTML =

    `
        <div class="loading">
            در حال بررسی نوبت‌های آزاد...
        </div>
    `;


    try {

        const url =
            GOOGLE_SCRIPT_URL +
            "?action=times" +
            "&date=" +
            encodeURIComponent(
                selectedGregorianDate
            ) +
            "&t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(
                data.message ||
                "خطا"
            );

        }


        if (
            data.friday
        ) {

            times.innerHTML =

            `
                <div class="no-times">
                    جمعه آرایشگاه تعطیل است.
                </div>
            `;

            return;

        }


        renderTimes(
            data.allTimes || [],
            data.reservedTimes || []
        );

    }

    catch(error) {

        console.error(error);


        times.innerHTML =

        `
            <div class="no-times">
                دریافت نوبت‌ها انجام نشد.
                <br>
                دوباره تلاش کنید.
            </div>
        `;

    }

    finally {

        loadingTimes =
            false;

        checkForm();

    }

}


/* =========================================
   نمایش ساعت‌ها
========================================= */

function renderTimes(
    allTimes,
    reservedTimes
) {

    const times =
        document.getElementById(
            "times"
        );


    times.innerHTML = "";


    if (
        !allTimes.length
    ) {

        times.innerHTML =

        `
            <div class="no-times">
                ساعتی برای این روز وجود ندارد.
            </div>
        `;

        return;

    }


    allTimes.forEach(
        time => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "time";


            button.textContent =
                toPersianDigits(
                    time
                );


            /*
              رزرو شده یا در انتظار تأیید
            */

            if (
                reservedTimes.includes(
                    time
                )
            ) {

                button.classList.add(
                    "reserved"
                );


                button.disabled =
                    true;


                button.title =
                    "این ساعت قبلاً گرفته شده است.";

            }

            else {

                button.addEventListener(
                    "click",
                    function() {

                        document
                            .querySelectorAll(
                                ".time"
                            )
                            .forEach(
                                item => {

                                    item.classList.remove(
                                        "selected"
                                    );

                                }
                            );


                        button.classList.add(
                            "selected"
                        );


                        selectedTime =
                            time;


                        checkForm();

                    }
                );

            }


            times.appendChild(
                button
            );

        }
    );

}


/* =========================================
   عناصر فرم
========================================= */

const nameInput =
document.getElementById(
    "customerName"
);


const phoneInput =
document.getElementById(
    "phone"
);


const submitButton =
document.getElementById(
    "submitButton"
);


const message =
document.getElementById(
    "message"
);


const bookingStatus =
document.getElementById(
    "bookingStatus"
);


/* =========================================
   ورودی نام
========================================= */

nameInput.addEventListener(
    "input",
    checkForm
);


/* =========================================
   ورودی موبایل
========================================= */

phoneInput.addEventListener(
    "input",
    function() {

        phoneInput.value =
            toEnglishDigits(
                phoneInput.value
            ).replace(
                /\D/g,
                ""
            );


        checkForm();

    }
);


/* =========================================
   بررسی فرم
========================================= */

function checkForm() {

    const name =
        nameInput.value.trim();


    const phone =
        phoneInput.value.trim();


    const validPhone =
        /^09\d{9}$/.test(
            phone
        );


    submitButton.disabled =

        !(
            selectedService &&
            selectedGregorianDate &&
            selectedTime &&
            name &&
            validPhone &&
            !loadingTimes &&
            !bookingId
        );

}


/* =========================================
   پیام
========================================= */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;


    message.className =
        "message " +
        type;

}


/* =========================================
   وضعیت نوبت
========================================= */

function showBookingStatus(
    type,
    text,
    id
) {

    bookingStatus.className =
        "booking-status " +
        type;


    bookingStatus.innerHTML =
        text;


    if (id) {

        bookingStatus.innerHTML +=

            `<span class="booking-id">
                کد نوبت: ${id}
            </span>`;

    }

}


/* =========================================
   ثبت نوبت
========================================= */

submitButton.addEventListener(
    "click",
    bookAppointment
);


async function bookAppointment() {

    if (
        submitButton.disabled
    ) {

        return;

    }


    submitButton.disabled =
        true;


    submitButton.textContent =
        "در حال ثبت...";


    try {

        const params =
            new URLSearchParams();


        params.append(
            "action",
            "book"
        );


        params.append(
            "customerName",
            nameInput.value.trim()
        );


        params.append(
            "phone",
            phoneInput.value.trim()
        );


        params.append(
            "service",
            selectedService
        );


        params.append(
            "date",
            selectedGregorianDate
        );


        params.append(
            "time",
            selectedTime
        );


        const response =
            await fetch(

                GOOGLE_SCRIPT_URL +
                "?" +
                params.toString() +
                "&t=" +
                Date.now(),

                {
                    cache:
                        "no-store"
                }

            );


        const data =
            await response.json();


        /*
          ساعت قبلاً گرفته شده
        */

        if (
            !data.success
        ) {

            showMessage(
                data.message ||
                "این ساعت قبلاً گرفته شده است.",
                "error"
            );


            await loadTimes();


            return;

        }


        /*
          ثبت موفق و انتظار تأیید
        */

        bookingId =
            data.id;


        showMessage(
            "نوبت شما ثبت شد و در انتظار تأیید مدیریت است.",
            "pending"
        );


        showBookingStatus(

            "pending",

            `
            ⏳ نوبت شما ثبت شد.
            <br>
            در انتظار تأیید مدیریت هستید.
            `,

            bookingId

        );


        /*
          فرم را غیرفعال می‌کنیم
        */

        nameInput.disabled =
            true;


        phoneInput.disabled =
            true;


        /*
          ساعت را دوباره می‌گیریم
        */

        await loadTimes();


        /*
          شروع بررسی وضعیت
        */

        startStatusChecking(
            bookingId
        );


    }

    catch(error) {

        console.error(error);


        showMessage(
            "ارتباط با سرور برقرار نشد.",
            "error"
        );

    }


    submitButton.textContent =
        "ثبت نوبت";


    checkForm();

}


/* =========================================
   بررسی وضعیت هر چند ثانیه
========================================= */

function startStatusChecking(
    id
) {

    if (statusTimer) {

        clearInterval(
            statusTimer
        );

    }


    /*
      هر 4 ثانیه
    */

    statusTimer =
        setInterval(
            function() {

                checkBookingStatus(
                    id
                );

            },
            4000
        );


    /*
      بلافاصله هم بررسی کن
    */

    checkBookingStatus(id);

}


/* =========================================
   دریافت وضعیت از سرور
========================================= */

async function checkBookingStatus(
    id
) {

    try {

        const url =
            GOOGLE_SCRIPT_URL +
            "?action=status" +
            "&id=" +
            encodeURIComponent(id) +
            "&t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !data.success
        ) {

            return;

        }


        /*
          تأیید شد
        */

        if (
            data.status ===
            "تأیید شد"
        ) {

            if (statusTimer) {

                clearInterval(
                    statusTimer
                );

            }


            showMessage(
                "نوبت شما با موفقیت رزرو شد.",
                "success"
            );


            showBookingStatus(

                "success",

                `
                ✅ نوبت شما با موفقیت رزرو شد.
                <br>
                منتظر شما هستیم.
                `,

                id

            );


            return;

        }


        /*
          لغو شد
        */

        if (
            data.status ===
            "لغو شد"
        ) {

            if (statusTimer) {

                clearInterval(
                    statusTimer
                );

            }


            showMessage(
                "نوبت شما توسط مدیریت لغو شد.",
                "cancelled"
            );


            showBookingStatus(

                "cancelled",

                `
                ❌ نوبت شما لغو شد.
                <br>
                می‌توانید زمان دیگری انتخاب کنید.
                `,

                id

            );


            /*
              ساعت آزاد شده
            */

            await loadTimes();


            return;

        }

    }

    catch(error) {

        console.error(error);

    }

}


/* =========================================
   شروع تقویم
========================================= */

(function initCalendar() {

    const today =
        new Date();


    calendarFirstGregorian =
        findPersianMonthStart(
            today
        );


    renderCalendar();

})();
