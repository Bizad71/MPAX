<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MESTER PAX | نوبت‌دهی</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #252525,
            #090909 70%
        );

    color: white;
}


.container {

    width: 100%;

    max-width: 520px;

    margin: auto;

    padding:
        20px 16px 50px;
}


.logo {

    text-align: center;

    padding:
        30px 0;
}


.logo h1 {

    margin: 0;

    font-size: 38px;

    letter-spacing: 4px;

}


.logo p {

    color: #888;

    margin-top: 10px;

    font-size: 14px;
}


.card {

    background: #171717;

    border:
        1px solid #2d2d2d;

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 18px;
}


.title {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 18px;
}


.services {

    display: grid;

    gap: 10px;
}


.service {

    width: 100%;

    padding: 15px;

    background: #222;

    color: white;

    border:
        1px solid #333;

    border-radius: 12px;

    font-family: inherit;

    cursor: pointer;

    text-align: right;

    font-size: 14px;
}


.service.selected {

    background: white;

    color: black;

    border-color: white;

    font-weight: bold;
}


.label {

    display: block;

    color: #999;

    font-size: 13px;

    margin-bottom: 8px;
}


input {

    width: 100%;

    height: 50px;

    background: #222;

    color: white;

    border:
        1px solid #333;

    border-radius: 12px;

    padding: 0 14px;

    font-family: inherit;

    font-size: 15px;

    outline: none;

    margin-bottom: 15px;
}


input:focus {

    border-color: #777;
}


/*
===============================
تاریخ
===============================
*/

.date-box {

    position: relative;
}


#date {

    position: absolute;

    opacity: 0;

    pointer-events: none;

    width: 1px;

    height: 1px;
}


#persianDate {

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #222;

    border:
        1px solid #333;

    border-radius: 12px;

    min-height: 50px;

    padding:
        0 14px;

    color: white;

    margin-bottom: 18px;
}


#persianDate.empty {

    color: #777;
}


/*
===============================
ساعت‌ها
===============================
*/

.times {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}


.time {

    min-height: 50px;

    background: #222;

    color: white;

    border:
        1px solid #333;

    border-radius: 12px;

    font-family: inherit;

    font-size: 15px;

    cursor: pointer;
}


.time:hover:not(:disabled) {

    border-color: #888;
}


.time.selected {

    background: white;

    color: black;

    border-color: white;

    font-weight: bold;
}


/*
ساعت رزروشده
*/

.time.reserved {

    background: #351d1d;

    color: #777;

    border-color: #4a2929;

    cursor: not-allowed;

    text-decoration:
        line-through;

}


.loading,
.empty {

    grid-column:
        1 / -1;

    text-align: center;

    color: #888;

    padding: 20px 5px;

    font-size: 13px;

    line-height: 2;
}


/*
===============================
ثبت
===============================
*/

.submit {

    width: 100%;

    height: 54px;

    margin-top: 5px;

    border: none;

    border-radius: 13px;

    background: white;

    color: black;

    font-family: inherit;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


.submit:disabled {

    opacity: .35;

    cursor: not-allowed;
}


.message {

    display: none;

    padding: 14px;

    margin-bottom: 18px;

    border-radius: 12px;

    text-align: center;

    font-size: 13px;

    line-height: 1.8;
}


.message.success {

    display: block;

    background: #12351f;

    color: #8ff0a4;
}


.message.error {

    display: block;

    background: #401c1c;

    color: #ff9999;
}


footer {

    text-align: center;

    color: #555;

    font-size: 12px;

    line-height: 2;

    margin-top: 25px;
}


@media(max-width:400px) {

    .logo h1 {

        font-size: 31px;

    }

}

</style>

</head>


<body>


<div class="container">


<div class="logo">

    <h1>MESTER PAX</h1>

    <p>
        مدیریت یوسف قربانی
    </p>

</div>


<div
    id="message"
    class="message"
></div>


<!-- خدمات -->

<div class="card">

    <div class="title">
        انتخاب خدمت
    </div>


    <div class="services">


        <button
            class="service"
            data-service="کوتاهی مو"
        >
            کوتاهی مو
        </button>


        <button
            class="service"
            data-service="اصلاح ریش"
        >
            اصلاح ریش
        </button>


        <button
            class="service"
            data-service="کوتاهی + اصلاح ریش"
        >
            کوتاهی + اصلاح ریش
        </button>


    </div>

</div>


<!-- تاریخ و ساعت -->

<div class="card">

    <div class="title">
        انتخاب تاریخ و ساعت
    </div>


    <label class="label">
        تاریخ
    </label>


    <div class="date-box">

        <div
            id="persianDate"
            class="empty"
        >

            <span id="dateText">
                انتخاب تاریخ
            </span>

            <span>
                📅
            </span>

        </div>


        <input
            type="date"
            id="date"
        >

    </div>


    <div
        id="times"
        class="times"
    >

        <div class="empty">

            ابتدا تاریخ را انتخاب کنید

        </div>

    </div>

</div>


<!-- اطلاعات مشتری -->

<div class="card">

    <div class="title">
        اطلاعات مشتری
    </div>


    <label class="label">
        نام و نام خانوادگی
    </label>

    <input
        id="customerName"
        type="text"
        placeholder="مثلاً علی رضایی"
    >


    <label class="label">
        شماره موبایل
    </label>

    <input
        id="phone"
        type="tel"
        maxlength="11"
        inputmode="numeric"
        placeholder="09123456789"
    >


    <button
        id="submitButton"
        class="submit"
        disabled
    >
        ثبت نوبت
    </button>

</div>


<footer>

    MESTER PAX

    <br>

    مدیریت یوسف قربانی

</footer>


</div>


<script>


/*
================================================
آدرس Google Apps Script
================================================
*/

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzn111x1wlJU2ey4WT-q8I7OIZvMyhyK_MlbZST98TCWJ4wix5w8hq4khaDiJPL_I39/exec";


/*
================================================
متغیرها
================================================
*/

let selectedService = "";

let selectedTime = "";

let loadingTimes = false;


/*
================================================
عناصر
================================================
*/

const serviceButtons =
document.querySelectorAll(
    ".service"
);


const datePicker =
document.getElementById(
    "date"
);


const persianDate =
document.getElementById(
    "persianDate"
);


const dateText =
document.getElementById(
    "dateText"
);


const times =
document.getElementById(
    "times"
);


const nameInput =
document.getElementById(
    "customerName"
);


const phoneInput =
document.getElementById(
    "phone"
);


const submitButton =
document.getElementById(
    "submitButton"
);


const message =
document.getElementById(
    "message"
);


/*
================================================
امروز
================================================
*/

const today =
new Date();


const todayISO =
today
    .toISOString()
    .split("T")[0];


datePicker.min =
todayISO;


/*
================================================
تبدیل میلادی به شمسی
================================================
*/

function toPersianDate(
    dateString
) {


    if (!dateString) {

        return "";

    }


    const parts =
        dateString.split("-");


    const year =
        Number(parts[0]);


    const month =
        Number(parts[1]);


    const day =
        Number(parts[2]);


    const date =
        new Date(
            year,
            month - 1,
            day
        );


    const formatter =
        new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        );


    return formatter.format(date);

}


/*
================================================
باز کردن تاریخ‌گیر
================================================
*/

persianDate.addEventListener(
    "click",
    function() {

        datePicker.showPicker();

    }
);


/*
================================================
انتخاب تاریخ
================================================
*/

datePicker.addEventListener(
    "change",
    function() {


        if (!datePicker.value) {

            return;

        }


        dateText.textContent =
            toPersianDate(
                datePicker.value
            );


        persianDate.classList.remove(
            "empty"
        );


        selectedTime = "";


        loadTimes();

    }
);


/*
================================================
انتخاب خدمت
================================================
*/

serviceButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            function() {


                serviceButtons.forEach(
                    item => {

                        item.classList.remove(
                            "selected"
                        );

                    }
                );


                button.classList.add(
                    "selected"
                );


                selectedService =
                    button.dataset.service;


                checkForm();

            }
        );

    }
);


/*
================================================
نمایش پیام
================================================
*/

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/*
================================================
دریافت ساعت‌ها
================================================
*/

async function loadTimes() {


    const date =
        datePicker.value;


    if (!date) {

        return;

    }


    if (loadingTimes) {

        return;

    }


    loadingTimes = true;


    selectedTime = "";


    checkForm();


    times.innerHTML =
    `
        <div class="loading">
            در حال بررسی نوبت‌های آزاد...
        </div>
    `;


    try {


        const url =
            GOOGLE_SCRIPT_URL +
            "?action=times" +
            "&date=" +
            encodeURIComponent(date) +
            "&t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message
                ||
                "خطا"
            );

        }


        renderTimes(
            data.allTimes || [],
            data.reservedTimes || []
        );


    }
    catch(error) {


        console.error(error);


        times.innerHTML =
        `
            <div class="empty">

                دریافت ساعت‌ها انجام نشد.

                <br>

                دوباره تلاش کنید.

            </div>
        `;

    }


    loadingTimes = false;


    checkForm();

}


/*
================================================
نمایش ساعت‌ها
================================================
*/

function renderTimes(
    allTimes,
    reservedTimes
) {


    times.innerHTML = "";


    if (!allTimes.length) {

        times.innerHTML =
        `
            <div class="empty">
                ساعتی تعریف نشده است.
            </div>
        `;

        return;

    }


    allTimes.forEach(
        time => {


            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "time";


            button.textContent =
                time;


            /*
            ====================================
            اگر رزرو شده باشد
            ====================================
            */

            if (
                reservedTimes.includes(
                    time
                )
            ) {


                button.classList.add(
                    "reserved"
                );


                button.disabled =
                    true;


                button.title =
                    "این ساعت قبلاً رزرو شده است.";


            }
            else {


                button.addEventListener(
                    "click",
                    function() {


                        document
                            .querySelectorAll(
                                ".time"
                            )
                            .forEach(
                                item => {

                                    item.classList.remove(
                                        "selected"
                                    );

                                }
                            );


                        button.classList.add(
                            "selected"
                        );


                        selectedTime =
                            time;


                        checkForm();

                    }
                );

            }


            times.appendChild(
                button
            );

        }
    );

}


/*
================================================
بررسی فرم
================================================
*/

function checkForm() {


    const name =
        nameInput.value.trim();


    const phone =
        phoneInput.value.trim();


    const validPhone =
        /^09\d{9}$/.test(
            phone
        );


    submitButton.disabled =
        !(
            selectedService &&
            datePicker.value &&
            selectedTime &&
            name &&
            validPhone &&
            !loadingTimes
        );

}


/*
================================================
نام
================================================
*/

nameInput.addEventListener(
    "input",
    checkForm
);


/*
================================================
شماره موبایل
================================================
*/

phoneInput.addEventListener(
    "input",
    function() {


        phoneInput.value =
            phoneInput.value.replace(
                /\D/g,
                ""
            );


        checkForm();

    }
);


/*
================================================
ثبت نوبت
================================================
*/

submitButton.addEventListener(
    "click",
    bookAppointment
);


async function bookAppointment() {


    if (
        submitButton.disabled
    ) {

        return;

    }


    const customerName =
        nameInput.value.trim();


    const phone =
        phoneInput.value.trim();


    const service =
        selectedService;


    const date =
        datePicker.value;


    const time =
        selectedTime;


    submitButton.disabled =
        true;


    submitButton.textContent =
        "در حال ثبت...";


    try {


        const params =
            new URLSearchParams();


        params.append(
            "action",
            "book"
        );


        params.append(
            "customerName",
            customerName
        );


        params.append(
            "phone",
            phone
        );


        params.append(
            "service",
            service
        );


        params.append(
            "date",
            date
        );


        params.append(
            "time",
            time
        );


        const response =
            await fetch(
                GOOGLE_SCRIPT_URL +
                "?" +
                params.toString() +
                "&t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        /*
        ========================================
        اگر قبلاً رزرو شده
        ========================================
        */

        if (!data.success) {


            showMessage(
                data.message ||
                "این ساعت قبلاً رزرو شده است.",
                "error"
            );


            /*
            ساعت‌ها را مجدداً بگیر
            */

            await loadTimes();


            return;

        }


        /*
        ========================================
        موفق
        ========================================
        */

        showMessage(
            "نوبت شما با موفقیت ثبت شد.",
            "success"
        );


        nameInput.value = "";

        phoneInput.value = "";

        selectedTime = "";


        /*
        ساعت رزروشده فوراً
        غیرفعال می‌شود
        */

        await loadTimes();


    }
    catch(error) {


        console.error(error);


        showMessage(
            "خطا در اتصال به سیستم.",
            "error"
        );

    }


    submitButton.textContent =
        "ثبت نوبت";


    checkForm();

}


</script>

</body>

</html>
