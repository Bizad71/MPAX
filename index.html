<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MESTER PAX</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at top,
      #292929 0%,
      #111 45%,
      #070707 100%
    );

  color: #fff;

  font-family:
    Tahoma,
    Arial,
    sans-serif;
}

.container {

  width: 100%;

  max-width: 520px;

  margin: auto;

  padding:
    20px 15px 50px;
}

.logo {

  text-align: center;

  padding:
    28px 0 25px;
}

.logo h1 {

  margin: 0;

  font-size: 38px;

  letter-spacing: 4px;
}

.logo p {

  margin:
    10px 0 0;

  color: #888;

  font-size: 13px;
}

.card {

  background: #171717;

  border:
    1px solid #2b2b2b;

  border-radius: 20px;

  padding: 20px;

  margin-bottom: 16px;
}

.title {

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 17px;
}

.services {

  display: grid;

  gap: 10px;
}

.service {

  width: 100%;

  border:
    1px solid #333;

  background: #222;

  color: #fff;

  border-radius: 12px;

  min-height: 52px;

  font-family: inherit;

  text-align: right;

  padding: 0 16px;

  cursor: pointer;

  font-size: 14px;
}

.service.selected {

  background: #fff;

  color: #000;

  border-color: #fff;

  font-weight: bold;
}


/* ============================
   CALENDAR
============================ */

.calendar {

  background: #111;

  border:
    1px solid #292929;

  border-radius: 17px;

  overflow: hidden;
}

.calendar-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 14px;

  border-bottom:
    1px solid #292929;
}

.calendar-title {

  text-align: center;

  font-size: 15px;

  font-weight: bold;
}

.calendar-nav {

  width: 38px;

  height: 38px;

  border: none;

  border-radius: 10px;

  background: #242424;

  color: white;

  font-size: 20px;

  cursor: pointer;
}

.calendar-nav:disabled {

  opacity: .25;

  cursor: not-allowed;
}

.weekdays {

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  padding:
    10px 7px 5px;

  color: #777;

  font-size: 11px;

  text-align: center;
}

.days {

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  gap: 5px;

  padding:
    5px 7px 12px;
}

.day {

  aspect-ratio: 1 / 1;

  min-width: 0;

  border: none;

  border-radius: 10px;

  background: #1d1d1d;

  color: #eee;

  font-family: inherit;

  cursor: pointer;

  font-size: 13px;
}

.day:hover {

  background: #333;
}

.day.empty {

  background: transparent;

  cursor: default;
}

.day.today {

  border:
    1px solid #777;
}

.day.selected {

  background: #fff;

  color: #000;

  font-weight: bold;
}

.day.disabled {

  color: #444;

  background: #151515;

  cursor: not-allowed;
}

.day.friday {

  color: #555;

  background: #121212;

  cursor: not-allowed;
}

.selected-date {

  text-align: center;

  padding:
    12px 10px 0;

  color: #bbb;

  font-size: 13px;
}


/* ============================
   TIMES
============================ */

.times {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 10px;

  margin-top: 16px;
}

.time {

  min-height: 50px;

  border:
    1px solid #333;

  background: #222;

  color: #fff;

  border-radius: 12px;

  font-family: inherit;

  font-size: 15px;

  cursor: pointer;
}

.time.selected {

  background: #fff;

  color: #000;

  border-color: #fff;

  font-weight: bold;
}

.time.reserved {

  background: #351b1b;

  color: #777;

  border-color: #4b2828;

  cursor: not-allowed;

  text-decoration: line-through;
}

.loading {

  grid-column:
    1 / -1;

  text-align: center;

  color: #777;

  padding: 20px 5px;

  font-size: 13px;
}

.no-times {

  grid-column:
    1 / -1;

  text-align: center;

  color: #777;

  padding: 20px 5px;

  font-size: 13px;

  line-height: 2;
}


/* ============================
   FORM
============================ */

.label {

  display: block;

  color: #888;

  font-size: 12px;

  margin:
    0 0 7px;
}

input {

  width: 100%;

  height: 50px;

  margin-bottom: 15px;

  padding:
    0 14px;

  border:
    1px solid #333;

  border-radius: 12px;

  background: #222;

  color: #fff;

  outline: none;

  font-family: inherit;

  font-size: 14px;
}

input:focus {

  border-color: #777;
}

.submit {

  width: 100%;

  height: 54px;

  margin-top: 3px;

  border: none;

  border-radius: 13px;

  background: #fff;

  color: #000;

  font-family: inherit;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}

.submit:disabled {

  opacity: .35;

  cursor: not-allowed;
}


/* ============================
   POPUP
============================ */

.popup-overlay {

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.78);

  display: none;

  align-items: center;

  justify-content: center;

  padding: 20px;

  z-index: 9999;
}

.popup-overlay.show {

  display: flex;
}

.popup {

  width: 100%;

  max-width: 390px;

  background: #181818;

  border:
    1px solid #333;

  border-radius: 22px;

  padding: 28px 22px;

  text-align: center;

  box-shadow:
    0 20px 70px
    rgba(0,0,0,.5);
}

.popup-icon {

  font-size: 42px;

  margin-bottom: 12px;
}

.popup-title {

  font-size: 19px;

  font-weight: bold;

  margin-bottom: 12px;
}

.popup-text {

  color: #aaa;

  font-size: 13px;

  line-height: 2;

  margin-bottom: 18px;
}

.popup-loading {

  width: 28px;

  height: 28px;

  border:
    3px solid #333;

  border-top-color: #fff;

  border-radius: 50%;

  margin: 15px auto;

  animation:
    spin .8s linear infinite;
}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}

.popup-button {

  width: 100%;

  height: 48px;

  border: none;

  border-radius: 12px;

  background: #fff;

  color: #000;

  font-family: inherit;

  font-weight: bold;

  cursor: pointer;

  display: none;
}

.popup.approved
.popup-button,
.popup.cancelled
.popup-button {

  display: block;
}


/* ============================
   MESSAGE
============================ */

.message {

  display: none;

  padding: 14px;

  border-radius: 12px;

  margin-bottom: 15px;

  text-align: center;

  font-size: 13px;

  line-height: 1.8;
}

.message.success {

  display: block;

  background: #12351e;

  color: #8eeaa2;
}

.message.error {

  display: block;

  background: #401b1b;

  color: #ff9b9b;
}

footer {

  text-align: center;

  color: #555;

  font-size: 11px;

  line-height: 2;

  margin-top: 20px;
}

@media(max-width:380px) {

  .logo h1 {
    font-size: 30px;
  }

  .day {
    font-size: 11px;
  }

}

</style>

</head>


<body>


<div class="container">


<div class="logo">

<div

      <div>شنبه</div>

<!-- POPUP -->

<div
  class="popup-overlay"

>

    class="popup"

      class="popup-icon"

      class="popup-loading"

      type="button"

      بستن
    </button>

</div>


<script>


/* ==================================================
   GOOGLE APPS SCRIPT
================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzn111x1wlJU2ey4WT-q8I7OIZvMyhyK_MlbZST98TCWJ4wix5w8hq4khaDiJPL_I39/exec";


/* ==================================================
   PERSIAN MONTHS
================================================== */

const monthNames = [

  "فروردین",
  "اردیبهشت",
  "خرداد",
  "تیر",
  "مرداد",
  "شهریور",
  "مهر",
  "آبان",
  "آذر",
  "دی",
  "بهمن",
  "اسفند"

];


const weekdayNames = [

  "شنبه",
  "یکشنبه",
  "دوشنبه",
  "سه‌شنبه",
  "چهارشنبه",
  "پنجشنبه",
  "جمعه"

];


const persianDigits =
"۰۱۲۳۴۵۶۷۸۹";


/* ==================================================
   VARIABLES
================================================== */

let selectedService = "";

let selectedTime = "";

let selectedGregorianDate = "";

let selectedBookingID = "";

let loadingTimes = false;

let currentMonthStart = null;


/* ==================================================
   PERSIAN DIGITS
================================================== */

function toPersianDigits(value) {

  return String(value)
    .replace(
      /\d/g,
      d =>
        persianDigits[
          Number(d)
        ]
    );

}


/* ==================================================
   GREGORIAN DATE KEY
================================================== */

function dateKey(date) {

  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth() + 1
    ).padStart(2, "0") +
    "-" +
    String(
      date.getDate()
    ).padStart(2, "0")
  );

}


/* ==================================================
   SAFE LOCAL DATE
================================================== */

function makeDate(
  year,
  month,
  day
) {

  return new Date(
    year,
    month - 1,
    day,
    12,
    0,
    0,
    0
  );

}


/* ==================================================
   PERSIAN FORMATTER
================================================== */

const persianFormatter =
  new Intl.DateTimeFormat(
    "fa-IR-u-ca-persian",
    {
      year: "numeric",
      month: "numeric",
      day: "numeric"
    }
  );


const persianMonthFormatter =
  new Intl.DateTimeFormat(
    "fa-IR-u-ca-persian",
    {
      year: "numeric",
      month: "long"
    }
  );


const persianWeekdayFormatter =
  new Intl.DateTimeFormat(
    "fa-IR-u-ca-persian",
    {
      weekday: "long"
    }
  );


/* ==================================================
   GET PERSIAN PARTS
================================================== */

function getPersianParts(date) {

  const parts =
    persianFormatter
      .formatToParts(date);


  let year = 0;

  let month = 0;

  let day = 0;


  parts.forEach(
    part => {

      if (
        part.type === "year"
      ) {

        year =
          Number(
            part.value
              .replace(
                /[۰-۹]/g,
                d =>
                  persianDigits.indexOf(d)
              )
          );

      }


      if (
        part.type === "month"
      ) {

        month =
          Number(
            part.value
              .replace(
                /[۰-۹]/g,
                d =>
                  persianDigits.indexOf(d)
              )
          );

      }


      if (
        part.type === "day"
      ) {

        day =
          Number(
            part.value
              .replace(
                /[۰-۹]/g,
                d =>
                  persianDigits.indexOf(d)
              )
          );

      }

    }
  );


  return {
    year,
    month,
    day
  };

}


/* ==================================================
   PERSIAN DATE TEXT
================================================== */

function persianDateText(date) {

  return (
    persianWeekdayFormatter.format(date) +
    " " +
    persianFormatter.format(date)
  );

}


/* ==================================================
   MONTH TITLE
================================================== */

function getMonthTitle(date) {

  return persianMonthFormatter.format(
    date
  );

}


/* ==================================================
   FIND FIRST GREGORIAN DAY OF PERSIAN MONTH
================================================== */

function findPersianMonthStart(
  targetYear,
  targetMonth
) {

  /*
   * جستجو در محدوده امن یک سال
   */

  const today =
    new Date();

  today.setHours(
    12, 0, 0, 0
  );


  for (
    let offset = -370;
    offset <= 370;
    offset++
  ) {

    const d =
      new Date(today);


    d.setDate(
      today.getDate() +
      offset
    );


    const p =
      getPersianParts(d);


    if (
      p.year === targetYear &&
      p.month === targetMonth &&
      p.day === 1
    ) {

      return d;

    }

  }


  return null;

}


/* ==================================================
   INITIALIZE CALENDAR
================================================== */

function initCalendar() {

  const today =
    new Date();


  today.setHours(
    12, 0, 0, 0
  );


  const p =
    getPersianParts(today);


  currentMonthStart =
    findPersianMonthStart(
      p.year,
      p.month
    );


  renderCalendar();

}


/* ==================================================
   RENDER CALENDAR
================================================== */

function renderCalendar() {

  const days =
    document.getElementById(
      "days"
    );


  const title =
    document.getElementById(
      "calendarTitle"
    );


  days.innerHTML = "";


  if (
    !currentMonthStart
  ) {

    return;

  }


  title.textContent =
    getMonthTitle(
      currentMonthStart
    );


  /*
   * روز اول ماه
   */

  const first =
    new Date(
      currentMonthStart
    );


  const firstWeekday =
    first.getDay();


  /*
   * JS:
   * Sunday 0
   *
   * ما:
   * Saturday 0
   */

  const saturdayIndex =
    (firstWeekday + 1) % 7;


  /*
   * خانه‌های خالی
   */

  for (
    let i = 0;
    i < saturdayIndex;
    i++
  ) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "day empty";


    days.appendChild(
      empty
    );

  }


  /*
   * امروز
   */

  const today =
    new Date();


  today.setHours(
    12, 0, 0, 0
  );


  const todayKey =
    dateKey(today);


  /*
   * تولید روزها
   */

  for (
    let i = 0;
    i < 32;
    i++
  ) {

    const date =
      new Date(
        first
      );


    date.setDate(
      first.getDate() + i
    );


    const p =
      getPersianParts(date);


    /*
     * وقتی وارد ماه بعد شدیم
     */

    if (
      p.year !==
        getPersianParts(
          first
        ).year ||
      p.month !==
        getPersianParts(
          first
        ).month
    ) {

      break;

    }


    const button =
      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "day";


    button.textContent =
      toPersianDigits(
        p.day
      );


    /*
     * جمعه
     */

    const isFriday =
      date.getDay() === 5;


    if (
      isFriday
    ) {

      button.classList.add(
        "friday"
      );

      button.disabled =
        true;

      button.title =
        "جمعه تعطیل است.";

    }


    /*
     * گذشته
     */

    const isPast =
      dateKey(date) <
      todayKey;


    if (
      isPast
    ) {

      button.classList.add(
        "disabled"
      );

      button.disabled =
        true;

    }


    /*
     * امروز
     */

    if (
      dateKey(date) ===
      todayKey
    ) {

      button.classList.add(
        "today"
      );

    }


    /*
     * انتخاب شده
     */

    if (
      selectedGregorianDate &&
      dateKey(date) ===
      selectedGregorianDate
    ) {

      button.classList.add(
        "selected"
      );

    }


    /*
     * کلیک
     */

    if (
      !isFriday &&
      !isPast
    ) {

      button.addEventListener(
        "click",
        function() {

          selectDate(
            date
          );

        }
      );

    }


    days.appendChild(
      button
    );

  }


  updateMonthButtons();

}


/* ==================================================
   MONTH BUTTONS
================================================== */

function updateMonthButtons() {

  const prev =
    document.getElementById(
      "prevMonth"
    );


  const today =
    new Date();


  today.setHours(
    12, 0, 0, 0
  );


  const todayParts =
    getPersianParts(
      today
    );


  const currentParts =
    getPersianParts(
      currentMonthStart
    );


  prev.disabled =
    (
      currentParts.year ===
        todayParts.year &&
      currentParts.month ===
        todayParts.month
    );

}


/* ==================================================
   NEXT MONTH
================================================== */

document
  .getElementById(
    "nextMonth"
  )
  .addEventListener(
    "click",
    function() {

      const d =
        new Date(
          currentMonthStart
        );


      d.setDate(
        d.getDate() + 35
      );


      const p =
        getPersianParts(d);


      currentMonthStart =
        findPersianMonthStart(
          p.year,
          p.month
        );


      renderCalendar();

    }
  );


/* ==================================================
   PREVIOUS MONTH
================================================== */

document
  .getElementById(
    "prevMonth"
  )
  .addEventListener(
    "click",
    function() {

      const d =
        new Date(
          currentMonthStart
        );


      d.setDate(
        d.getDate() - 2
      );


      const p =
        getPersianParts(d);


      const today =
        new Date();


      const tp =
        getPersianParts(
          today
        );


      if (
        p.year < tp.year ||
        (
          p.year === tp.year &&
          p.month < tp.month
        )
      ) {

        return;

      }


      currentMonthStart =
        findPersianMonthStart(
          p.year,
          p.month
        );


      renderCalendar();

    }
  );


/* ==================================================
   SELECT DATE
================================================== */

function selectDate(date) {

  selectedGregorianDate =
    dateKey(date);


  selectedTime = "";


  document.getElementById(
    "selectedDateText"
  ).textContent =
    persianDateText(
      date
    );


  renderCalendar();


  loadTimes();


  checkForm();

}


/* ==================================================
   SERVICES
================================================== */

document
  .querySelectorAll(
    ".service"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(
              ".service"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "selected"
                )
            );


          button.classList.add(
            "selected"
          );


          selectedService =
            button.dataset.service;


          checkForm();

        }
      );

    }
  );


/* ==================================================
   LOAD TIMES
================================================== */

async function loadTimes() {

  if (
    !selectedGregorianDate
  ) {

    return;

  }


  if (
    loadingTimes
  ) {

    return;

  }


  loadingTimes =
    true;


  selectedTime =
    "";


  checkForm();


  const times =
    document.getElementById(
      "times"
    );


  times.innerHTML =
  `
    <div class="loading">
      در حال بررسی نوبت‌های آزاد...
    </div>
  `;


  try {

    const url =
      GOOGLE_SCRIPT_URL +
      "?action=times" +
      "&date=" +
      encodeURIComponent(
        selectedGregorianDate
      ) +
      "&t=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "خطا"
      );

    }


    renderTimes(
      data.allTimes || [],
      data.reservedTimes || [],
      data.friday
    );

  }

  catch(error) {

    console.error(
      error
    );


    times.innerHTML =
    `
      <div class="no-times">
        دریافت نوبت‌ها انجام نشد.
        <br>
        دوباره تلاش کنید.
      </div>
    `;

  }


  loadingTimes =
    false;


  checkForm();

}


/* ==================================================
   RENDER TIMES
================================================== */

function renderTimes(
  allTimes,
  reservedTimes,
  friday
) {

  const times =
    document.getElementById(
      "times"
    );


  times.innerHTML = "";


  if (
    friday
  ) {

    times.innerHTML =
    `
      <div class="no-times">
        جمعه تعطیل است.
        <br>
        امکان رزرو نوبت وجود ندارد.
      </div>
    `;

    return;

  }


  if (
    !allTimes.length
  ) {

    times.innerHTML =
    `
      <div class="no-times">
        ساعتی برای این روز تعریف نشده است.
      </div>
    `;

    return;

  }


  allTimes.forEach(
    time => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "time";


      button.textContent =
        toPersianDigits(
          time
        );


      if (
        reservedTimes.includes(
          time
        )
      ) {

        button.classList.add(
          "reserved"
        );


        button.disabled =
          true;


        button.title =
          "این ساعت رزرو شده است.";

      }

      else {

        button.addEventListener(
          "click",
          function() {

            document
              .querySelectorAll(
                ".time"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "selected"
                  )
              );


            button.classList.add(
              "selected"
            );


            selectedTime =
              time;


            checkForm();

          }
        );

      }


      times.appendChild(
        button
      );

    }
  );

}


/* ==================================================
   FORM
================================================== */

const nameInput =
  document.getElementById(
    "customerName"
  );


const phoneInput =
  document.getElementById(
    "phone"
  );


const submitButton =
  document.getElementById(
    "submitButton"
  );


const message =
  document.getElementById(
    "message"
  );


nameInput.addEventListener(
  "input",
  checkForm
);


phoneInput.addEventListener(
  "input",
  function() {

    phoneInput.value =
      phoneInput.value.replace(
        /\D/g,
        ""
      );


    checkForm();

  }
);


/* ==================================================
   CHECK FORM
================================================== */

function checkForm() {

  const name =
    nameInput.value.trim();


  const phone =
    phoneInput.value.trim();


  const validPhone =
    /^09\d{9}$/.test(
      phone
    );


  submitButton.disabled =
    !(
      selectedService &&
      selectedGregorianDate &&
      selectedTime &&
      name &&
      validPhone &&
      !loadingTimes
    );

}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
  text,
  type
) {

  message.textContent =
    text;


  message.className =
    "message " +
    type;

}


/* ==================================================
   POPUP
================================================== */

const popupOverlay =
  document.getElementById(
    "popupOverlay"
  );


const popup =
  document.getElementById(
    "popup"
  );


const popupIcon =
  document.getElementById(
    "popupIcon"
  );


const popupTitle =
  document.getElementById(
    "popupTitle"
  );


const popupText =
  document.getElementById(
    "popupText"
  );


const popupLoading =
  document.getElementById(
    "popupLoading"
  );


const popupButton =
  document.getElementById(
    "popupButton"
  );


function showPendingPopup() {

  popup.className =
    "popup";


  popupIcon.textContent =
    "⏳";


  popupTitle.textContent =
    "در انتظار تأیید مدیر";


  popupText.innerHTML =
    `
      نوبت شما ثبت شده است.
      <br>
      لطفاً منتظر تأیید مدیر باشید.
    `;


  popupLoading.style.display =
    "block";


  popupButton.style.display =
    "none";


  popupOverlay.classList.add(
    "show"
  );

}


function showApprovedPopup() {

  popup.className =
    "popup approved";


  popupIcon.textContent =
    "✅";


  popupTitle.textContent =
    "نوبت شما تأیید شد";


  popupText.innerHTML =
    `
      نوبت شما با موفقیت رزرو شد.
      <br>
      منتظر شما هستیم.
    `;


  popupLoading.style.display =
    "none";


  popupButton.style.display =
    "block";


  popupButton.textContent =
    "بستن";


  popupOverlay.classList.add(
    "show"
  );

}


function showCancelledPopup() {

  popup.className =
    "popup cancelled";


  popupIcon.textContent =
    "❌";


  popupTitle.textContent =
    "نوبت لغو شد";


  popupText.innerHTML =
    `
      متأسفانه مدیر نوبت شما را تأیید نکرد.
      <br>
      لطفاً یک زمان دیگر انتخاب کنید.
    `;


  popupLoading.style.display =
    "none";


  popupButton.style.display =
    "block";


  popupButton.textContent =
    "بستن";


  popupOverlay.classList.add(
    "show"
  );

}


popupButton.addEventListener(
  "click",
  function() {

    popupOverlay.classList.remove(
      "show"
    );

  }
);


/* ==================================================
   BOOK
================================================== */

submitButton.addEventListener(
  "click",
  bookAppointment
);


async function bookAppointment() {

  if (
    submitButton.disabled
  ) {

    return;

  }


  submitButton.disabled =
    true;


  submitButton.textContent =
    "در حال ثبت...";


  try {

    const params =
      new URLSearchParams();


    params.append(
      "action",
      "book"
    );


    params.append(
      "customerName",
      nameInput.value.trim()
    );


    params.append(
      "phone",
      phoneInput.value.trim()
    );


    params.append(
      "service",
      selectedService
    );


    params.append(
      "date",
      selectedGregorianDate
    );


    params.append(
      "time",
      selectedTime
    );


    const response =
      await fetch(

        GOOGLE_SCRIPT_URL +
        "?" +
        params.toString() +
        "&t=" +
        Date.now(),

        {
          cache:
            "no-store"
        }

      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      showMessage(
        data.message ||
        "ثبت نوبت انجام نشد.",
        "error"
      );


      await loadTimes();


      return;

    }


    /*
     * ID نوبت
     */

    selectedBookingID =
      data.id;


    /*
     * پاک کردن پیام قبلی
     */

    message.className =
      "message";


    /*
     * پاک کردن اطلاعات فرم
     */

    nameInput.value =
      "";

    phoneInput.value =
      "";


    selectedTime =
      "";


    checkForm();


    /*
     * نمایش پاپ‌آپ
     */

    showPendingPopup();


    /*
     * شروع بررسی وضعیت
     */

    startStatusPolling(
      selectedBookingID
    );

  }

  catch(error) {

    console.error(
      error
    );


    showMessage(
      "ارتباط با سرور برقرار نشد.",
      "error"
    );

  }


  submitButton.textContent =
    "ثبت نوبت";


  checkForm();

}


/* ==================================================
   STATUS POLLING
================================================== */

let statusTimer =
  null;


let statusPollingActive =
  false;


function startStatusPolling(
  id
) {

  if (
    statusTimer
  ) {

    clearInterval(
      statusTimer
    );

  }


  statusPollingActive =
    true;


  /*
   * اولین بررسی سریع
   */

  checkBookingStatus(
    id
  );


  /*
   * هر ۲ ثانیه
   */

  statusTimer =
    setInterval(
      function() {

        if (
          statusPollingActive
        ) {

          checkBookingStatus(
            id
          );

        }

      },
      2000
    );

}


/* ==================================================
   CHECK STATUS
================================================== */

async function checkBookingStatus(
  id
) {

  try {

    const url =
      GOOGLE_SCRIPT_URL +
      "?action=status" +
      "&id=" +
      encodeURIComponent(
        id
      ) +
      "&t=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      return;

    }


    const status =
      String(
        data.status || ""
      )
      .toUpperCase();


    /*
     * APPROVED
     */

    if (
      status ===
      "APPROVED"
    ) {

      stopStatusPolling();


      showApprovedPopup();


      return;

    }


    /*
     * CANCELLED
     */

    if (
      status ===
      "CANCELLED"
    ) {

      stopStatusPolling();


      showCancelledPopup();


      return;

    }


    /*
     * PENDING
     */

  }

  catch(error) {

    console.error(
      "Status error:",
      error
    );

  }

}


/* ==================================================
   STOP POLLING
================================================== */

function stopStatusPolling() {

  statusPollingActive =
    false;


  if (
    statusTimer
  ) {

    clearInterval(
      statusTimer
    );


    statusTimer =
      null;

  }

}


/* ==================================================
   START
================================================== */

initCalendar();
