<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MESTER PAX</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at top,
      #292929 0%,
      #111 45%,
      #070707 100%
    );

  color: #fff;

  font-family:
    Tahoma,
    Arial,
    sans-serif;
}

.container {

  width: 100%;

  max-width: 520px;

  margin: auto;

  padding:
    20px 15px 50px;
}

.logo {

  text-align: center;

  padding:
    28px 0 25px;
}

.logo h1 {

  margin: 0;

  font-size: 38px;

  letter-spacing: 4px;
}

.logo p {

  margin: 10px 0 0;

  color: #888;

  font-size: 13px;
}

.card {

  background: #171717;

  border:
    1px solid #2b2b2b;

  border-radius: 20px;

  padding: 20px;

  margin-bottom: 16px;
}

.title {

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 17px;
}

.services {

  display: grid;

  gap: 10px;
}

.service {

  width: 100%;

  border:
    1px solid #333;

  background: #222;

  color: #fff;

  border-radius: 12px;

  min-height: 52px;

  font-family: inherit;

  text-align: right;

  padding: 0 16px;

  cursor: pointer;

  font-size: 14px;
}

.service.selected {

  background: #fff;

  color: #000;

  border-color: #fff;

  font-weight: bold;
}

.calendar {

  background: #111;

  border:
    1px solid #292929;

  border-radius: 17px;

  overflow: hidden;
}

.calendar-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 14px;

  border-bottom:
    1px solid #292929;
}

.calendar-title {

  text-align: center;

  font-size: 15px;

  font-weight: bold;
}

.calendar-nav {

  width: 38px;

  height: 38px;

  border: none;

  border-radius: 10px;

  background: #242424;

  color: white;

  font-size: 20px;

  cursor: pointer;
}

.weekdays {

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  padding:
    10px 7px 5px;

  color: #777;

  font-size: 11px;

  text-align: center;
}

.days {

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  gap: 5px;

  padding:
    5px 7px 12px;
}

.day {

  aspect-ratio: 1 / 1;

  border: none;

  border-radius: 10px;

  background: #1d1d1d;

  color: #eee;

  font-family: inherit;

  cursor: pointer;

  font-size: 13px;
}

.day.empty {

  background: transparent;

  cursor: default;
}

.day.today {

  border:
    1px solid #777;
}

.day.selected {

  background: #fff;

  color: #000;

  font-weight: bold;
}

.day.disabled {

  color: #444;

  background: #151515;

  cursor: not-allowed;
}

.day.friday {

  color: #555;

  background: #151515;

  cursor: not-allowed;
}

.selected-date {

  text-align: center;

  padding:
    12px 10px 0;

  color: #bbb;

  font-size: 13px;
}

.times {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 10px;

  margin-top: 16px;
}

.time {

  min-height: 50px;

  border:
    1px solid #333;

  background: #222;

  color: #fff;

  border-radius: 12px;

  font-family: inherit;

  font-size: 15px;

  cursor: pointer;
}

.time.selected {

  background: #fff;

  color: #000;

  font-weight: bold;
}

.time.reserved {

  background: #351b1b;

  color: #777;

  border-color: #4b2828;

  cursor: not-allowed;

  text-decoration: line-through;
}

.loading {

  grid-column: 1 / -1;

  text-align: center;

  color: #777;

  padding: 20px 5px;

  font-size: 13px;
}

.no-times {

  grid-column: 1 / -1;

  text-align: center;

  color: #777;

  padding: 20px 5px;

  font-size: 13px;

  line-height: 2;
}

.label {

  display: block;

  color: #888;

  font-size: 12px;

  margin-bottom: 7px;
}

input {

  width: 100%;

  height: 50px;

  margin-bottom: 15px;

  padding:
    0 14px;

  border:
    1px solid #333;

  border-radius: 12px;

  background: #222;

  color: #fff;

  outline: none;

  font-family: inherit;

  font-size: 14px;
}

.submit {

  width: 100%;

  height: 54px;

  border: none;

  border-radius: 13px;

  background: #fff;

  color: #000;

  font-family: inherit;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}

.submit:disabled {

  opacity: .35;

  cursor: not-allowed;
}

.message {

  display: none;

  padding: 16px;

  border-radius: 12px;

  margin-bottom: 15px;

  text-align: center;

  font-size: 13px;

  line-height: 2;
}

.message.show {

  display: block;
}

.message.pending {

  background: #332c12;

  color: #ffe68a;
}

.message.success {

  background: #12351e;

  color: #8eeaa2;
}

.message.error {

  background: #401b1b;

  color: #ff9b9b;
}

.status-id {

  direction: ltr;

  display: block;

  margin-top: 5px;

  color: #aaa;

  font-size: 11px;
}

footer {

  text-align: center;

  color: #555;

  font-size: 11px;

  line-height: 2;

  margin-top: 20px;
}

@media(max-width:380px) {

  .logo h1 {
    font-size: 30px;
  }

  .day {
    font-size: 11px;
  }

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

  <h1>MESTER PAX</h1>

  <p>
    مدیریت یوسف قربانی
  </p>

</div>


<div
  id="message"
  class="message"
></div>


<div class="card">

  <div class="title">
    انتخاب خدمت
  </div>

  <div class="services">

    <button
      type="button"
      class="service"
      data-service="کوتاهی مو"
    >
      کوتاهی مو
    </button>

    <button
      type="button"
      class="service"
      data-service="اصلاح ریش"
    >
      اصلاح ریش
    </button>

    <button
      type="button"
      class="service"
      data-service="کوتاهی + اصلاح ریش"
    >
      کوتاهی + اصلاح ریش
    </button>

  </div>

</div>


<div class="card">

  <div class="title">
    انتخاب تاریخ و ساعت
  </div>

  <div class="calendar">

    <div class="calendar-header">

      <button
        type="button"
        class="calendar-nav"
        id="nextMonth"
      >
        ‹
      </button>

      <div
        class="calendar-title"
        id="calendarTitle"
      ></div>

      <button
        type="button"
        class="calendar-nav"
        id="prevMonth"
      >
        ›
      </button>

    </div>

    <div class="weekdays">

      <div>شنبه</div>
      <div>یکشنبه</div>
      <div>دوشنبه</div>
      <div>سه‌شنبه</div>
      <div>چهارشنبه</div>
      <div>پنجشنبه</div>
      <div>جمعه</div>

    </div>

    <div
      class="days"
      id="days"
    ></div>

  </div>

  <div
    class="selected-date"
    id="selectedDateText"
  >
    تاریخ انتخاب نشده
  </div>

  <div
    class="times"
    id="times"
  >

    <div class="no-times">
      ابتدا یک تاریخ را انتخاب کنید
    </div>

  </div>

</div>


<div class="card">

  <div class="title">
    اطلاعات مشتری
  </div>

  <label class="label">
    نام مشتری
  </label>

  <input
    id="customerName"
    type="text"
    placeholder="مثلاً علی رضایی"
  >

  <label class="label">
    شماره موبایل
  </label>

  <input
    id="phone"
    type="tel"
    inputmode="numeric"
    maxlength="11"
    placeholder="09123456789"
  >

  <button
    type="button"
    id="submitButton"
    class="submit"
    disabled
  >
    ثبت درخواست نوبت
  </button>

</div>


<footer>

  MESTER PAX

  <br>

  مدیریت یوسف قربانی

</footer>

</div>


<script>

/*
==================================================
Google Apps Script
==================================================
*/

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzn111x1wlJU2ey4WT-q8I7OIZvMyhyK_MlbZST98TCWJ4wix5w8hq4khaDiJPL_I39/exec";


/*
==================================================
تنظیمات
==================================================
*/

const MONTHS = [

  "فروردین",
  "اردیبهشت",
  "خرداد",
  "تیر",
  "مرداد",
  "شهریور",
  "مهر",
  "آبان",
  "آذر",
  "دی",
  "بهمن",
  "اسفند"

];


const WEEKDAYS = [

  "شنبه",
  "یکشنبه",
  "دوشنبه",
  "سه‌شنبه",
  "چهارشنبه",
  "پنجشنبه",
  "جمعه"

];


const PERSIAN_DIGITS =
"۰۱۲۳۴۵۶۷۸۹";


/*
==================================================
متغیرها
==================================================
*/

let selectedService = "";

let selectedTime = "";

let selectedDate = null;

let calendarDate = null;

let pendingRequestId = null;

let statusTimer = null;

let loadingTimes = false;


/*
==================================================
تبدیل عدد
==================================================
*/

function fa(value) {

  return String(value)
    .replace(
      /\d/g,
      d => PERSIAN_DIGITS[d]
    );

}


/*
==================================================
تاریخ شمسی با Intl
==================================================
*/

/*
این روش دیگر از فرمول قبلی استفاده نمی‌کند.
مرورگر تاریخ میلادی واقعی را می‌گیرد
و خودش تقویم Persian را محاسبه می‌کند.
*/

function getPersianParts(date) {

  const formatter =
    new Intl.DateTimeFormat(
      "fa-IR-u-ca-persian-nu-latn",
      {
        year: "numeric",
        month: "numeric",
        day: "numeric",
        weekday: "long"
      }
    );


  const parts =
    formatter.formatToParts(date);


  const result = {};


  parts.forEach(
    part => {

      if (
        part.type !== "literal"
      ) {

        result[part.type] =
          part.value;

      }

    }
  );


  return {

    year:
      Number(result.year),

    month:
      Number(result.month),

    day:
      Number(result.day),

    weekday:
      result.weekday

  };

}


/*
==================================================
ISO
==================================================
*/

function toISO(date) {

  const y =
    date.getFullYear();


  const m =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");


  const d =
    String(
      date.getDate()
    ).padStart(2, "0");


  return `${y}-${m}-${d}`;

}


/*
==================================================
کپی تاریخ
==================================================
*/

function cloneDate(date) {

  return new Date(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  );

}


/*
==================================================
مقایسه روز
==================================================
*/

function sameDay(a, b) {

  return (
    a.getFullYear() ===
      b.getFullYear() &&

    a.getMonth() ===
      b.getMonth() &&

    a.getDate() ===
      b.getDate()
  );

}


/*
==================================================
جمعه
==================================================
*/

function isFridayDate(date) {

  return date.getDay() === 5;

}


/*
==================================================
اولین روز ماه شمسی
==================================================
*/

function findFirstGregorianOfPersianMonth(
  year,
  month
) {

  /*
  از اول ماه میلادی شروع می‌کنیم
  و حداکثر چند روز جلو می‌رویم.
  */

  const now =
    new Date();

  let start =
    new Date(
      now.getFullYear() - 1,
      0,
      1
    );


  /*
  اگر ماه فعلی باشد، از امروز شروع می‌کنیم.
  */

  for (
    let i = 0;
    i < 800;
    i++
  ) {

    const p =
      getPersianParts(start);


    if (
      p.year === year &&
      p.month === month &&
      p.day === 1
    ) {

      return start;

    }


    start.setDate(
      start.getDate() + 1
    );

  }


  return null;

}


/*
==================================================
دریافت تاریخ‌های ماه
==================================================
*/

function getPersianMonthDates(
  year,
  month
) {

  const first =
    findFirstGregorianOfPersianMonth(
      year,
      month
    );


  if (!first) {

    return [];

  }


  const result = [];

  let current =
    cloneDate(first);


  for (
    let i = 0;
    i < 31;
    i++
  ) {

    const p =
      getPersianParts(current);


    if (
      p.year !== year ||
      p.month !== month
    ) {

      break;

    }


    result.push({
      date:
        cloneDate(current),

      day:
        p.day
    });


    current.setDate(
      current.getDate() + 1
    );

  }


  return result;

}


/*
==================================================
شروع
==================================================
*/

function init() {

  const today =
    new Date();


  const p =
    getPersianParts(today);


  calendarDate =
    findFirstGregorianOfPersianMonth(
      p.year,
      p.month
    );


  renderCalendar();

}


/*
==================================================
نمایش تقویم
==================================================
*/

function renderCalendar() {

  const title =
    document.getElementById(
      "calendarTitle"
    );


  const daysBox =
    document.getElementById(
      "days"
    );


  const p =
    getPersianParts(
      calendarDate
    );


  title.textContent =
    MONTHS[p.month - 1] +
    " " +
    fa(p.year);


  daysBox.innerHTML = "";


  const monthDates =
    getPersianMonthDates(
      p.year,
      p.month
    );


  if (
    !monthDates.length
  ) {

    return;

  }


  /*
  شنبه = ستون اول
  */

  const first =
    monthDates[0].date;


  let firstColumn =
    first.getDay() + 1;


  if (
    firstColumn === 7
  ) {

    firstColumn = 0;

  }


  for (
    let i = 0;
    i < firstColumn;
    i++
  ) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "day empty";


    daysBox.appendChild(
      empty
    );

  }


  const today =
    new Date();


  monthDates.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "day";


      button.textContent =
        fa(item.day);


      const date =
        item.date;


      if (
        sameDay(
          date,
          today
        )
      ) {

        button.classList.add(
          "today"
        );

      }


      if (
        selectedDate &&
        sameDay(
          date,
          selectedDate
        )
      ) {

        button.classList.add(
          "selected"
        );

      }


      if (
        date < new Date(
          today.getFullYear(),
          today.getMonth(),
          today.getDate()
        )
      ) {

        button.disabled =
          true;

        button.classList.add(
          "disabled"
        );

      }


      /*
      جمعه
      */

      if (
        isFridayDate(date)
      ) {

        button.disabled =
          true;

        button.classList.add(
          "friday"
        );

        button.title =
          "جمعه تعطیل است.";

      }


      if (
        !button.disabled
      ) {

        button.addEventListener(
          "click",
          () => {

            selectDate(
              date
            );

          }
        );

      }


      daysBox.appendChild(
        button
      );

    }
  );

}


/*
==================================================
انتخاب تاریخ
==================================================
*/

async function selectDate(
  date
) {

  if (
    isFridayDate(date)
  ) {

    return;

  }


  selectedDate =
    cloneDate(date);


  selectedTime = "";


  const p =
    getPersianParts(
      selectedDate
    );


  document.getElementById(
    "selectedDateText"
  ).textContent =

    p.weekday +
    " " +
    fa(p.day) +
    " " +
    MONTHS[p.month - 1] +
    " " +
    fa(p.year);


  renderCalendar();


  await loadTimes();


  checkForm();

}


/*
==================================================
ماه بعد
==================================================
*/

document
  .getElementById(
    "nextMonth"
  )
  .addEventListener(
    "click",
    function() {

      const d =
        cloneDate(
          calendarDate
        );


      d.setDate(1);

      d.setMonth(
        d.getMonth() + 1
      );


      /*
      از اول ماه شروع می‌کنیم
      تا تقویم شمسی درست باشد.
      */

      const p =
        getPersianParts(d);


      const first =
        findFirstGregorianOfPersianMonth(
          p.year,
          p.month
        );


      if (first) {

        calendarDate =
          first;

        renderCalendar();

      }

    }
  );


/*
==================================================
ماه قبل
==================================================
*/

document
  .getElementById(
    "prevMonth"
  )
  .addEventListener(
    "click",
    function() {

      const d =
        cloneDate(
          calendarDate
        );


      d.setDate(1);

      d.setMonth(
        d.getMonth() - 1
      );


      const p =
        getPersianParts(d);


      const today =
        getPersianParts(
          new Date()
        );


      /*
      اجازه برگشت به ماه قبل
      از ماه جاری را نمی‌دهیم.
      */

      if (
        p.year < today.year ||
        (
          p.year === today.year &&
          p.month < today.month
        )
      ) {

        return;

      }


      const first =
        findFirstGregorianOfPersianMonth(
          p.year,
          p.month
        );


      if (first) {

        calendarDate =
          first;

        renderCalendar();

      }

    }
  );


/*
==================================================
خدمات
==================================================
*/

document
  .querySelectorAll(
    ".service"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(
              ".service"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "selected"
                )
            );


          button.classList.add(
            "selected"
          );


          selectedService =
            button.dataset.service;


          checkForm();

        }
      );

    }
  );


/*
==================================================
دریافت ساعت‌ها
==================================================
*/

async function loadTimes() {

  if (
    !selectedDate
  ) {

    return;

  }


  const times =
    document.getElementById(
      "times"
    );


  selectedTime = "";


  loadingTimes = true;


  checkForm();


  times.innerHTML =
  `
    <div class="loading">
      در حال بررسی...
    </div>
  `;


  try {

    const iso =
      toISO(
        selectedDate
      );


    const url =
      GOOGLE_SCRIPT_URL +
      "?action=times" +
      "&date=" +
      encodeURIComponent(
        iso
      ) +
      "&t=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "خطا"
      );

    }


    if (
      data.friday
    ) {

      times.innerHTML =
      `
        <div class="no-times">
          جمعه آرایشگاه تعطیل است.
        </div>
      `;

      return;

    }


    renderTimes(
      data.allTimes || [],
      data.reservedTimes || []
    );

  }

  catch (error) {

    console.error(error);


    times.innerHTML =
    `
      <div class="no-times">
        دریافت نوبت‌ها انجام نشد.
        <br>
        دوباره تلاش کنید.
      </div>
    `;

  }

  finally {

    loadingTimes = false;

    checkForm();

  }

}


/*
==================================================
نمایش ساعت‌ها
==================================================
*/

function renderTimes(
  allTimes,
  reservedTimes
) {

  const times =
    document.getElementById(
      "times"
    );


  times.innerHTML = "";


  if (
    !allTimes.length
  ) {

    times.innerHTML =
    `
      <div class="no-times">
        ساعتی برای این روز تعریف نشده است.
      </div>
    `;

    return;

  }


  allTimes.forEach(
    time => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "time";


      button.textContent =
        time;


      if (
        reservedTimes.includes(
          time
        )
      ) {

        button.disabled =
          true;

        button.classList.add(
          "reserved"
        );

        button.title =
          "این ساعت در انتظار تأیید یا قبلاً رزرو شده است.";

      }
      else {

        button.addEventListener(
          "click",
          function() {

            document
              .querySelectorAll(
                ".time"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "selected"
                  )
              );


            button.classList.add(
              "selected"
            );


            selectedTime =
              time;


            checkForm();

          }
        );

      }


      times.appendChild(
        button
      );

    }
  );

}


/*
==================================================
فرم
==================================================
*/

const nameInput =
  document.getElementById(
    "customerName"
  );


const phoneInput =
  document.getElementById(
    "phone"
  );


const submitButton =
  document.getElementById(
    "submitButton"
  );


const message =
  document.getElementById(
    "message"
  );


nameInput.addEventListener(
  "input",
  checkForm
);


phoneInput.addEventListener(
  "input",
  function() {

    phoneInput.value =
      phoneInput.value.replace(
        /\D/g,
        ""
      );


    checkForm();

  }
);


/*
==================================================
بررسی فرم
==================================================
*/

function checkForm() {

  const validPhone =
    /^09\d{9}$/.test(
      phoneInput.value.trim()
    );


  submitButton.disabled =
    !(
      selectedService &&
      selectedDate &&
      selectedTime &&
      nameInput.value.trim() &&
      validPhone &&
      !loadingTimes &&
      !pendingRequestId
    );

}


/*
==================================================
پیام
==================================================
*/

function showMessage(
  text,
  type,
  id
) {

  message.className =
    "message show " +
    type;


  message.innerHTML =
    text;


  if (id) {

    message.innerHTML +=
      `<span class="status-id">
        کد پیگیری: ${id}
      </span>`;

  }

}


/*
==================================================
ثبت نوبت
==================================================
*/

submitButton.addEventListener(
  "click",
  bookAppointment
);


async function bookAppointment() {

  if (
    submitButton.disabled
  ) {

    return;

  }


  submitButton.disabled =
    true;


  submitButton.textContent =
    "در حال ثبت...";


  try {

    const params =
      new URLSearchParams();


    params.append(
      "action",
      "book"
    );


    params.append(
      "customerName",
      nameInput.value.trim()
    );


    params.append(
      "phone",
      phoneInput.value.trim()
    );


    params.append(
      "service",
      selectedService
    );


    params.append(
      "date",
      toISO(
        selectedDate
      )
    );


    params.append(
      "time",
      selectedTime
    );


    /*
    ثبت با GET
    */

    const response =
      await fetch(
        GOOGLE_SCRIPT_URL +
        "?" +
        params.toString() +
        "&t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      showMessage(
        data.message ||
        "ثبت نوبت انجام نشد.",
        "error"
      );


      await loadTimes();


      return;

    }


    /*
    خیلی مهم:
    هنوز رزرو قطعی نشده.
    */

    pendingRequestId =
      data.id;


    showMessage(
      "⏳ درخواست نوبت شما ثبت شد.<br>در انتظار تأیید مدیریت...",
      "pending",
      data.id
    );


    /*
    اطلاعات مشتری را پاک نمی‌کنیم
    تا وضعیت مشخص شود.
    */


    /*
    ساعت فوراً برای سایر کاربران
    غیرقابل انتخاب می‌شود.
    */

    await loadTimes();


    /*
    بررسی وضعیت هر 3 ثانیه
    */

    startStatusPolling(
      data.id
    );

  }

  catch (error) {

    console.error(error);


    showMessage(
      "ارتباط با سرور برقرار نشد. دوباره تلاش کنید.",
      "error"
    );

  }

  finally {

    if (
      !pendingRequestId
    ) {

      submitButton.textContent =
        "ثبت درخواست نوبت";

      checkForm();

    }

  }

}


/*
==================================================
بررسی وضعیت
==================================================
*/

function startStatusPolling(
  id
) {

  if (
    statusTimer
  ) {

    clearInterval(
      statusTimer
    );

  }


  /*
  یک بار فوری
  */

  checkAppointmentStatus(
    id
  );


  /*
  بعد هر 3 ثانیه
  */

  statusTimer =
    setInterval(
      function() {

        checkAppointmentStatus(
          id
        );

      },
      3000
    );

}


/*
==================================================
وضعیت نوبت
==================================================
*/

async function checkAppointmentStatus(
  id
) {

  try {

    const url =
      GOOGLE_SCRIPT_URL +
      "?action=status" +
      "&id=" +
      encodeURIComponent(
        id
      ) +
      "&t=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      return;

    }


    /*
    تأیید
    */

    if (
      data.status ===
      "APPROVED"
    ) {

      stopStatusPolling();


      pendingRequestId =
        null;


      showMessage(
        "✅ نوبت شما با موفقیت رزرو شد.",
        "success",
        id
      );


      submitButton.textContent =
        "ثبت نوبت جدید";


      /*
      برای رزرو بعدی
      */

      selectedTime =
        "";


      document
        .querySelectorAll(
          ".time"
        )
        .forEach(
          item =>
            item.classList.remove(
              "selected"
            )
        );


      checkForm();


      return;

    }


    /*
    لغو
    */

    if (
      data.status ===
      "REJECTED"
    ) {

      stopStatusPolling();


      pendingRequestId =
        null;


      showMessage(
        "❌ نوبت شما توسط مدیریت لغو شد.",
        "error",
        id
      );


      submitButton.textContent =
        "ثبت نوبت جدید";


      selectedTime =
        "";


      await loadTimes();


      checkForm();


      return;

    }


    /*
    هنوز pending
    */

    showMessage(
      "⏳ درخواست نوبت شما ثبت شده و در انتظار تأیید مدیریت است.",
      "pending",
      id
    );

  }

  catch (error) {

    console.error(
      "Status error:",
      error
    );

  }

}


/*
==================================================
توقف بررسی
==================================================
*/

function stopStatusPolling() {

  if (
    statusTimer
  ) {

    clearInterval(
      statusTimer
    );

    statusTimer =
      null;

  }

}


/*
==================================================
شروع
==================================================
*/

init();

</script>
